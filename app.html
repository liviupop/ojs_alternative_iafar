// ═══════════════════════════════════════════════════════════════════════
//  HELPER FUNCTIONS
// ═══════════════════════════════════════════════════════════════════════

function splitAuthors(authors='') {
  return authors.split(',').map(a => a.trim()).filter(Boolean);
}

function normalizeAuthorText(value='') {
  return String(value || '')
    .replace(/[Ş]/g, 'Ș')
    .replace(/[ş]/g, 'ș')
    .replace(/[Ţ]/g, 'Ț')
    .replace(/[ţ]/g, 'ț')
    .replace(/\s+/g, ' ')
    .trim();
}

function parseAuthorIdentity(name='') {
  const raw = normalizeAuthorText(name);
  const ascii = raw
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[’'`"]/g, '')
    .replace(/[.,;:()[\]{}]/g, ' ')
    .replace(/-/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  const tokens = ascii ? ascii.split(' ').filter(Boolean) : [];
  const surname = tokens[tokens.length - 1] || '';
  const given = tokens.slice(0, -1);
  const firstGiven = given[0] || '';
  const firstInitial = firstGiven ? firstGiven[0] : '';
  const compact = [...given, surname].join(' ').trim();
  const hasAbbreviation = /(^|\s)[A-Za-zĂÂÎȘȚŞŢ]\.?($|\s)/.test(raw);
  return { raw, compact, tokens, surname, firstGiven, firstInitial, hasAbbreviation };
}

function authorNamesEquivalent(leftName='', rightName='') {
  const left = parseAuthorIdentity(leftName);
  const right = parseAuthorIdentity(rightName);
  if (!left.compact || !right.compact) return false;
  if (left.compact === right.compact) return true;
  const leftCompactNoSpace = left.compact.replace(/\s+/g, '');
  const rightCompactNoSpace = right.compact.replace(/\s+/g, '');
  if (leftCompactNoSpace && leftCompactNoSpace === rightCompactNoSpace) return true;
  if (left.tokens.length === 1 && right.tokens.length >= 2 && leftCompactNoSpace.startsWith(right.firstGiven) && leftCompactNoSpace.endsWith(right.surname)) return true;
  if (right.tokens.length === 1 && left.tokens.length >= 2 && rightCompactNoSpace.startsWith(left.firstGiven) && rightCompactNoSpace.endsWith(left.surname)) return true;
  if (!left.surname || left.surname !== right.surname) return false;
  if (!left.firstInitial || left.firstInitial !== right.firstInitial) return false;
  if (left.hasAbbreviation || right.hasAbbreviation) return true;
  if (!left.firstGiven || !right.firstGiven) return false;
  return left.firstGiven.startsWith(right.firstGiven) || right.firstGiven.startsWith(left.firstGiven);
}

function authorDisplayScore(name='') {
  const raw = normalizeAuthorText(name);
  let score = raw.length;
  if (/[șțȘȚ]/.test(raw)) score += 8;
  if (/[şţŞŢ]/.test(raw)) score -= 8;
  if (/\b[A-ZĂÂÎȘȚŞŢ]\./.test(raw)) score -= 2;
  return score;
}

function resolveAuthorMapValue(map={}, name='') {
  if (!name || !map || typeof map !== 'object') return '';
  if (map[name]) return map[name];
  for (const [key, value] of Object.entries(map)) {
    if (authorNamesEquivalent(key, name)) return value;
  }
  return '';
}

function splitKeywords(value='') {
  return value.split(',').map(k => k.trim()).filter(Boolean);
}

function firstNonEmptyField(obj, fields=[]) {
  for (const field of fields) {
    const val = String(obj?.[field] || '').trim();
    if (val) return val;
  }
  return '';
}

function guessLangLabelFromField(field='') {
  const f = String(field || '').toLowerCase();
  if (f.includes('_en') || f.includes('_eng') || f.includes('english')) return 'EN';
  if (f.includes('_de') || f.includes('_deu') || f.includes('_ger') || f.includes('german')) return 'DE';
  if (f.includes('_fr') || f.includes('_fra') || f.includes('french')) return 'FR';
  if (f.includes('_ro') || f.includes('romanian')) return 'RO';
  return '';
}

function getAlternateArticleTitle(art) {
  const mainTitle = String(art?.title || '').trim().toLowerCase();
  const fixedCandidates = [
    'title_en', 'title_de', 'title_fr',
    'foreign_title', 'title_foreign',
    'title_translated', 'translated_title',
    'title_alt', 'title_secondary',
    'title_english', 'title_german', 'title_french',
    'title_original', 'title_other_lang', 'title_other_language',
  ];
  const dynamicCandidates = Object.keys(art || {}).filter(field => {
    const key = String(field || '').toLowerCase();
    if (!key || key === 'title') return false;
    if (!key.includes('title')) return false;
    return /(en|eng|de|deu|ger|fr|fra|foreign|translated|alt|original|other)/.test(key);
  });
  const titleCandidates = Array.from(new Set([...fixedCandidates, ...dynamicCandidates]));
  for (const field of titleCandidates) {
    const raw = String(art?.[field] || '').trim();
    if (!raw) continue;
    if (raw.toLowerCase() === mainTitle) continue;
    return { title: raw, lang: guessLangLabelFromField(field) || String(art?.title_foreign_lang || '').toUpperCase() };
  }
  return null;
}

function getPrimaryArticleAbstract(art) {
  return firstNonEmptyField(art, ['abstract_en', 'abstract_de', 'abstract_fr', 'abstract_ro']);
}

function selectArticleKeyword(keyword='') {
  const articleId = String(State.pageParams?.id || '');
  if (!articleId) return;
  const current = String(State.pageParams?.keyword || '');
  const nextKeyword = keyword === current ? '' : keyword;
  State.pageParams = nextKeyword
    ? { id: articleId, keyword: nextKeyword }
    : { id: articleId };
  renderTopbar();
  renderPage();
  updateHeadMetadata();
}

function escapeHtml(value='') {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function escapeJs(value='') {
  return String(value).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, ' ');
}

function copyText(text='') {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(String(text)).then(() => toast('Copiat în clipboard.', 'success'));
    return;
  }
  toast('Clipboard indisponibil.', 'warning');
}

function articleDoi(art) {
  return String(art?.doi || '').trim();
}

function getAuthorProfiles(art) {
  const names = splitAuthors(art.authors);
  const affiliations = (art.affiliations || '').split(';').map(item => item.trim());
  const emails = (art.emails || '').split(';').map(item => item.trim());
  return names.map((name, idx) => ({
    name,
    affiliation: affiliations[idx] || affiliations[0] || '',
    email: emails[idx] || '',
    orcid: resolveAuthorMapValue(AUTHOR_ORCID, name) || '',
    links: resolveAuthorMapValue(AUTHOR_EXTERNAL_LINKS, name) || {},
  }));
}

function getAuthorExternalLinks(name='', aliases=[]) {
  const candidates = [name, ...aliases].filter(Boolean);
  const merged = {};
  for (const candidate of candidates) {
    const links = resolveAuthorMapValue(AUTHOR_EXTERNAL_LINKS, candidate) || {};
    if (!merged.scholar && links.scholar) merged.scholar = links.scholar;
    if (!merged.academia && links.academia) merged.academia = links.academia;
    if (!merged.researchgate && links.researchgate) merged.researchgate = links.researchgate;
  }
  const rows = [];
  if (merged.scholar) rows.push({ label: 'Google Scholar', url: merged.scholar });
  if (merged.academia) rows.push({ label: 'Academia.edu', url: merged.academia });
  if (merged.researchgate) rows.push({ label: 'ResearchGate', url: merged.researchgate });
  return rows;
}

function getArticleUrls(art) {
  const articlePath = routePathFor('public-article', { id: art.id });
  const mdPath = routePathFor('public-article-md', { id: art.id });
  const pdfPath = routePathFor('pdf-viewer', { type: 'article', id: art.id });
  const staticMdPath = `/md-twins/${String(art.id).padStart(2,'0')}-${slugify(art.title).slice(0,80)}.md`;
  const base = getBaseUrl();
  return {
    articlePath,
    mdPath,
    pdfPath,
    staticMdPath,
    articleUrl: `${base}${articlePath}`,
    mdUrl: `${base}${mdPath}`,
    staticMdUrl: `${base}${staticMdPath}`,
    pdfUrl: `${base}${pdfPath}`,
  };
}

function resolveAssetUrl(path='') {
  const raw = String(path || '').trim();
  if (!raw) return '';
  if (/^(https?:)?\/\//.test(raw) || raw.startsWith('data:') || raw.startsWith('blob:') || raw.startsWith('file:')) {
    return raw;
  }
  const clean = raw.replace(/^\.?\//, '');
  return isFileMode() ? `./${clean}` : `/${clean}`;
}

function defaultIssuePdfPath(issue) {
  if (!issue) return '';
  const series = getIssueSeries(issue);
  if (series === 'seria-1') {
    const mapped = SERIES1_SOURCE_PDF_BY_SLUG[String(issue.slug || '')] || SERIES1_SOURCE_PDF_BY_YEAR[String(issue.year || '')] || '';
    return mapped ? `ingest/series1/${mapped}` : '';
  }
  if (series === 'seria-2') {
    const fallback = SERIES2_FALLBACK_ISSUES.find(iss => String(iss.slug || '') === String(issue.slug || ''));
    if (fallback?.pdf) return `ingest/series2/${fallback.pdf}`;
  }
  return '';
}

function resolvePdfAsset(type='article', id='') {
  const safeType = type === 'issue' ? 'issue' : 'article';
  if (safeType === 'issue') {
    const issue = DB.getIssue(String(id || ''));
    if (!issue) return null;
    const issuePdfPath = normalizePdfPath(issue.issue_pdf_path, defaultIssuePdfPath(issue));
    if (!issuePdfPath) return null;
    return {
      url: resolveAssetUrl(issuePdfPath),
      filePath: String(issuePdfPath),
      filename: `numar-vol-${slugify(issue.volume || issue.id)}-nr-${slugify(issue.number || issue.id)}-${issue.year || ''}.pdf`,
    };
  }
  const article = DB.getArticle(String(id || ''));
  if (!article || !article.pdf_path) return null;
  return {
    url: resolveAssetUrl(article.pdf_path),
    filePath: String(article.pdf_path),
    filename: `${slugify(article.title).slice(0, 80) || `articol-${article.id}`}.pdf`,
  };
}

function issueCoverFolderPath(issue) {
  if (!issue) return '';
  if (issue.cover_hint_path) return String(issue.cover_hint_path).replace(/\/+$/, '');
  if (issue.slug) return `ingest/issues/${issue.slug}/cover`;
  return '';
}

function normalizeJournalTitleFromIssue(issueTitle='') {
  let normalized = String(issueTitle || '').replace(/\s+/g, ' ').trim();
  if (!normalized) return '';
  normalized = normalized
    .replace(/\s*\(.*?\)\s*$/g, '')
    .replace(/\s+(?:nr\.?|no\.?)\s*[\w\-–]+$/i, '')
    .replace(/\s+(?:vol\.?)\s*[\w\-–]+$/i, '')
    .replace(/\s+[IVXLCDM]+(?:[-–][IVXLCDM]+)?$/i, '')
    .replace(/\s+\d{4}(?:[-–]\d{4})?$/g, '')
    .trim();
  if (!/^anuar/i.test(normalized)) return '';
  return normalized;
}

function getJournalTitleForIssue(issue) {
  const fromIssue = normalizeJournalTitleFromIssue(issue?.title || '');
  if (fromIssue) return fromIssue;
  const series = getIssueSeries(issue);
  if (series === 'seria-2') return 'Anuarul de folclor';
  if (series === 'seria-1') return 'Anuarul Arhivei de Folklor';
  if (series === 'seria-3') return 'Anuarul Arhivei de Folclor';
  return 'Anuarul Arhivei de Folclor';
}

function formatCitation(art, issue, style='apa') {
  const authors = splitAuthors(art.authors).join(', ');
  const year = issue?.year || '';
  const pages = `${art.pages_start}–${art.pages_end}`;
  const urls = getArticleUrls(art);
  const journalTitle = getJournalTitleForIssue(issue);
  if (style === 'chicago') {
    return `${authors}. "${art.title}." ${journalTitle} ${issue?.volume || ''}, no. ${issue?.number || ''} (${year}): ${pages}.`;
  }
  if (style === 'bibtex') {
    const key = `${splitAuthors(art.authors)[0]?.split(' ').slice(-1)[0] || 'author'}${year}${art.id}`;
    return `@article{${slugify(key)},\n  title={${art.title}},\n  author={${splitAuthors(art.authors).join(' and ')}},\n  journal={${journalTitle}},\n  year={${year}},\n  volume={${issue?.volume || ''}},\n  number={${issue?.number || ''}},\n  pages={${art.pages_start}-${art.pages_end}},\n  url={${urls.articleUrl}}\n}`;
  }
  if (style === 'ris') {
    return `TY  - JOUR\nTI  - ${art.title}\nAU  - ${splitAuthors(art.authors).join('\nAU  - ')}\nJO  - ${journalTitle}\nVL  - ${issue?.volume || ''}\nIS  - ${issue?.number || ''}\nPY  - ${year}\nSP  - ${art.pages_start}\nEP  - ${art.pages_end}\nUR  - ${urls.articleUrl}\nER  -`;
  }
  return `${authors} (${year}). ${art.title}. ${journalTitle}, ${issue?.volume || ''}(${issue?.number || ''}), ${pages}.`;
}

function copyCitationFor(style, articleId) {
  const art = DB.getArticle(articleId);
  if (!art) return;
  const issue = DB.getIssue(art.issue_id);
  const text = formatCitation(art, issue, style);
  copyText(text);
  toast(`Citare ${style.toUpperCase()} copiată.`, 'success');
}

function downloadCitationFile(style, articleId) {
  const art = DB.getArticle(articleId);
  if (!art) return;
  const issue = DB.getIssue(art.issue_id);
  const content = formatCitation(art, issue, style);
  const ext = style === 'ris' ? 'ris' : 'bib';
  downloadFile(content, `${slugify(art.title).slice(0, 48) || `article-${art.id}`}.${ext}`, 'text/plain');
}

function buildDoajXml(articles, baseUrl, pdfBaseUrl) {
  let xml = `<?xml version="1.0" encoding="UTF-8"?>\n<records>\n`;
  articles.forEach(art => {
    const issue = DB.getIssue(art.issue_id);
    const authors = splitAuthors(art.authors);
    const affs = (art.affiliations || '').split(';').map(a => a.trim());
    xml += `  <record>\n`;
    xml += `    <language>${art.language || 'ro'}</language>\n`;
    xml += `    <publisher>${escXml(JOURNAL.publisher)}</publisher>\n`;
    xml += `    <journalTitle>${escXml(JOURNAL.name)}</journalTitle>\n`;
    xml += `    <issn>${JOURNAL.issn}</issn>\n`;
    xml += `    <eissn>${JOURNAL.eissn}</eissn>\n`;
    xml += `    <publicationDate>${issue?.date_published || ''}</publicationDate>\n`;
    xml += `    <volume>${issue?.volume || ''}</volume>\n`;
    xml += `    <issue>${issue?.number || ''}</issue>\n`;
    xml += `    <startPage>${art.pages_start}</startPage>\n`;
    xml += `    <endPage>${art.pages_end}</endPage>\n`;
    xml += `    <documentType>article</documentType>\n`;
    xml += `    <title language="${art.language || 'ro'}">${escXml(art.title)}</title>\n`;
    xml += `    <authors>\n`;
    authors.forEach((author, idx) => {
      xml += `      <author>\n`;
      xml += `        <name>${escXml(author)}</name>\n`;
      if (affs[idx]) xml += `        <affiliation>${escXml(affs[idx])}</affiliation>\n`;
      xml += `      </author>\n`;
    });
    xml += `    </authors>\n`;
    if (art.abstract_ro) xml += `    <abstract language="ro">${escXml(art.abstract_ro)}</abstract>\n`;
    if (art.abstract_en) xml += `    <abstract language="en">${escXml(art.abstract_en)}</abstract>\n`;
    const kwRo = splitKeywords(art.keywords_ro);
    const kwEn = splitKeywords(art.keywords_en);
    if (kwRo.length) {
      xml += `    <keywords language="ro">\n`;
      kwRo.forEach(k => { xml += `      <keyword>${escXml(k)}</keyword>\n`; });
      xml += `    </keywords>\n`;
    }
    if (kwEn.length) {
      xml += `    <keywords language="en">\n`;
      kwEn.forEach(k => { xml += `      <keyword>${escXml(k)}</keyword>\n`; });
      xml += `    </keywords>\n`;
    }
    xml += `    <fullTextUrl format="pdf">${pdfBaseUrl}${art.id}.pdf</fullTextUrl>\n`;
    xml += `    <documentUrl>${baseUrl}${art.id}</documentUrl>\n`;
    xml += `  </record>\n`;
  });
  xml += `</records>`;
  return xml;
}

function buildCrossrefXml(articles, version='5.3.1') {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  let xml = `<?xml version="1.0" encoding="UTF-8"?>\n`;
  xml += `<doi_batch version="${version}" xmlns="http://www.crossref.org/schema/${version}" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">\n`;
  xml += `  <head>\n`;
  xml += `    <doi_batch_id>rec-${y}${m}${d}</doi_batch_id>\n`;
  xml += `    <timestamp>${y}${m}${d}120000</timestamp>\n`;
  xml += `    <depositor><name>${escXml(JOURNAL.publisher)}</name><email_address>anuar@iafar.ro</email_address></depositor>\n`;
  xml += `    <registrant>${escXml(JOURNAL.publisher)}</registrant>\n`;
  xml += `  </head>\n`;
  xml += `  <body>\n`;
  xml += `    <journal>\n`;
  xml += `      <journal_metadata language="ro"><full_title>${escXml(JOURNAL.name)}</full_title><abbrev_title>${escXml(JOURNAL.abbr)}</abbrev_title><issn media_type="print">${JOURNAL.issn}</issn><issn media_type="electronic">${JOURNAL.eissn}</issn></journal_metadata>\n`;
  articles.forEach(art => {
    const issue = DB.getIssue(art.issue_id);
    const urls = getArticleUrls(art);
    xml += `      <journal_issue>\n`;
    xml += `        <publication_date media_type="online"><year>${issue?.year || ''}</year></publication_date>\n`;
    xml += `        <journal_volume><volume>${issue?.volume || ''}</volume></journal_volume>\n`;
    xml += `        <issue>${issue?.number || ''}</issue>\n`;
    xml += `      </journal_issue>\n`;
    xml += `      <journal_article publication_type="full_text">\n`;
    xml += `        <titles><title>${escXml(art.title)}</title></titles>\n`;
    xml += `        <contributors>\n`;
    splitAuthors(art.authors).forEach((author, idx) => {
      const names = author.split(' ');
      const surname = names.length > 1 ? names[names.length - 1] : author;
      const given = names.slice(0, -1).join(' ');
      xml += `          <person_name contributor_role="author" sequence="${idx===0?'first':'additional'}"><given_name>${escXml(given)}</given_name><surname>${escXml(surname)}</surname></person_name>\n`;
    });
    xml += `        </contributors>\n`;
    xml += `        <publication_date media_type="online"><year>${issue?.year || ''}</year></publication_date>\n`;
    xml += `        <pages><first_page>${art.pages_start}</first_page><last_page>${art.pages_end}</last_page></pages>\n`;
    xml += `        <doi_data><resource>${escXml(urls.articleUrl)}</resource></doi_data>\n`;
    xml += `      </journal_article>\n`;
  });
  xml += `    </journal>\n`;
  xml += `  </body>\n`;
  xml += `</doi_batch>`;
  return xml;
}

function buildArticleXml(art, format='doaj', baseUrl='https://www.iafar.ro/article/', pdfUrl='https://www.iafar.ro/pdf/') {
  if (format === 'doaj') return buildDoajXml([art], baseUrl, pdfUrl);
  return buildCrossrefXml([art], format === 'crossref' ? '4.4.2' : '5.3.1');
}

function articleViewCount(articleId) {
  return Number(State.metrics.articleViews[String(articleId)] || 0);
}

function pdfDownloadCount(articleId) {
  return Number(State.metrics.pdfDownloads[String(articleId)] || 0);
}

function metricEventsList(kind='views', articleId='') {
  const key = String(articleId || '');
  const source = kind === 'downloads' ? State.metrics.pdfDownloadEvents : State.metrics.articleViewEvents;
  const arr = Array.isArray(source?.[key]) ? source[key] : [];
  return arr
    .map(item => Number(item))
    .filter(item => Number.isFinite(item) && item > 0);
}

function pushMetricEvent(kind='views', articleId='') {
  const key = String(articleId || '');
  if (!key) return;
  const target = kind === 'downloads' ? State.metrics.pdfDownloadEvents : State.metrics.articleViewEvents;
  if (!target[key]) target[key] = [];
  target[key].push(Date.now());
}

function metricStats(articleId, kind='views') {
  const key = String(articleId || '');
  const events = metricEventsList(kind, key);
  const now = Date.now();
  const startToday = (() => {
    const d = new Date(now);
    d.setHours(0, 0, 0, 0);
    return d.getTime();
  })();
  const last7Start = now - (7 * 24 * 60 * 60 * 1000);
  const periodCount = (since) => events.reduce((acc, ts) => acc + (ts >= since ? 1 : 0), 0);
  const storedTotal = kind === 'downloads' ? pdfDownloadCount(key) : articleViewCount(key);
  const total = Math.max(storedTotal, events.length);
  return {
    today: periodCount(startToday),
    last7: periodCount(last7Start),
    total,
  };
}

function registerArticlePageView(articleId) {
  const key = String(articleId || '');
  if (!key || State.lastCountedArticleId === key) return;
  State.metrics.articleViews[key] = articleViewCount(key) + 1;
  pushMetricEvent('views', key);
  State.lastCountedArticleId = key;
  persistMetrics();
}

function registerPdfDownload(articleId) {
  const key = String(articleId || '');
  if (!key) return;
  State.metrics.pdfDownloads[key] = pdfDownloadCount(key) + 1;
  pushMetricEvent('downloads', key);
  persistMetrics();
}

function resetViewMetrics() {
  if (State.role !== 'admin') {
    toast('Acces permis doar administratorului.', 'error');
    return;
  }
  State.metrics = { articleViews: {}, pdfDownloads: {}, articleViewEvents: {}, pdfDownloadEvents: {} };
  State.lastCountedArticleId = '';
  localStorage.removeItem(STORAGE_KEYS.metrics);
  persistMetrics();
  toast('Statisticile de accesare au fost resetate.', 'success');
  renderPage();
}

function downloadPdfFromViewer(type='article', id='') {
  const safeType = type === 'issue' ? 'issue' : 'article';
  const safeId = String(id || '');
  if (!safeId) return;
  const pdfAsset = resolvePdfAsset(safeType, safeId);
  if (!pdfAsset?.url) {
    toast(tr('PDF indisponibil pentru acest document.', 'PDF is unavailable for this document.'), 'warning');
    return;
  }
  const link = document.createElement('a');
  link.href = pdfAsset.url;
  link.download = pdfAsset.filename || (safeType === 'article' ? `articol-${safeId}.pdf` : `numar-${safeId}.pdf`);
  link.rel = 'noopener';
  document.body.appendChild(link);
  link.click();
  link.remove();
  if (safeType === 'article') registerPdfDownload(safeId);
  toast(tr('Descărcare PDF pornită.', 'PDF download started.'), 'success');
}

function openPdfViewer(type='article', id='') {
  const safeType = type === 'issue' ? 'issue' : 'article';
  const safeId = String(id || '');
  if (!safeId) return;
  navigate('pdf-viewer', { type: safeType, id: safeId });
}

function downloadArticlePdf(articleId) {
  openPdfViewer('article', articleId);
}

function downloadIssuePdf(issueId) {
  openPdfViewer('issue', issueId);
}

function iconizeElement(el) {
  if (!el) return;
  let html = el.innerHTML;

  Object.entries(SOLAR_ICON_MAP).forEach(([emoji, icon]) => {
    if (html.includes(emoji)) {
      html = html.split(emoji).join(solarIcon(icon));
      changed = true;

function clearDynamicHeadMeta() {
  document.head.querySelectorAll('[data-dynamic-meta="1"]').forEach(el => el.remove());
}

function appendDynamicMeta(attrName, attrValue, content) {
  const meta = document.createElement('meta');
  meta.setAttribute(attrName, attrValue);
  meta.setAttribute('content', content || '');
  meta.setAttribute('data-dynamic-meta', '1');
  document.head.appendChild(meta);
}

function appendDynamicLink(rel, href) {
  const link = document.createElement('link');
  link.setAttribute('rel', rel);
  link.setAttribute('href', href);
  link.setAttribute('data-dynamic-meta', '1');
  document.head.appendChild(link);
}

function appendDynamicJsonLd(obj) {
  const script = document.createElement('script');
  script.type = 'application/ld+json';
  script.setAttribute('data-dynamic-meta', '1');
  script.textContent = JSON.stringify(obj);
  document.head.appendChild(script);
}

function updateHeadMetadata() {
  clearDynamicHeadMeta();
  const baseTitle = `${JOURNAL.name} — AcademCMS`;
  let title = baseTitle;
  let canonicalPath = routePathFor(State.currentPage, State.pageParams || {});

  if (State.currentPage === 'public-article' || State.currentPage === 'public-article-md') {
    const art = DB.getArticle(State.pageParams?.id || '');
    if (art) {
      const issue = DB.getIssue(art.issue_id);
      const journalTitle = getJournalTitleForIssue(issue);
      title = `${art.title} | ${JOURNAL.abbr}`;
      canonicalPath = routePathFor('public-article', { id: art.id });
      const urls = getArticleUrls(art);
      const authors = getAuthorProfiles(art);

      appendDynamicMeta('name', 'description', `${art.abstract_ro || art.abstract_en || JOURNAL.description}`.slice(0, 280));
      appendDynamicMeta('property', 'og:type', 'article');
      appendDynamicMeta('property', 'og:title', art.title);
      appendDynamicMeta('property', 'og:url', urls.articleUrl);
      appendDynamicMeta('name', 'DC.Title', art.title);
      authors.forEach(a => appendDynamicMeta('name', 'DC.Creator', a.name));
      appendDynamicMeta('name', 'DC.Identifier', urls.articleUrl);
      appendDynamicMeta('name', 'DC.Language', art.language || 'ro');
      appendDynamicMeta('name', 'citation_title', art.title);
      splitAuthors(art.authors).forEach(a => appendDynamicMeta('name', 'citation_author', a));
      appendDynamicMeta('name', 'citation_journal_title', journalTitle);
      appendDynamicMeta('name', 'citation_publication_date', issue?.date_published || '');
      appendDynamicMeta('name', 'citation_volume', issue?.volume || '');
      appendDynamicMeta('name', 'citation_issue', issue?.number || '');
      appendDynamicMeta('name', 'citation_firstpage', art.pages_start || '');
      appendDynamicMeta('name', 'citation_lastpage', art.pages_end || '');
      appendDynamicMeta('name', 'citation_pdf_url', urls.pdfUrl);

      appendDynamicJsonLd({
        '@context': 'https://schema.org',
        '@type': 'ScholarlyArticle',
        headline: art.title,
        name: art.title,
        author: authors.map(a => ({
          '@type': 'Person',
          name: a.name,
          identifier: a.orcid ? `https://orcid.org/${a.orcid}` : undefined,
          affiliation: a.affiliation ? { '@type': 'Organization', name: a.affiliation } : undefined,
        })),
        isPartOf: {
          '@type': 'PublicationIssue',
          issueNumber: issue?.number || '',
          isPartOf: {
            '@type': 'Periodical',
            name: journalTitle,
            issn: JOURNAL.issn,
          },
        },
        datePublished: issue?.date_published || '',
        pagination: `${art.pages_start}-${art.pages_end}`,
        inLanguage: art.language || 'ro',
        license: 'https://creativecommons.org/licenses/by/4.0/',
        identifier: urls.articleUrl,
        sameAs: urls.articleUrl,
      });
    }
  } else if (State.currentPage === 'public-issue') {
    const issue = DB.getIssue(State.pageParams?.id || '');
    if (issue) {
      const issueTitle = String(issue.title || 'Anuarul Arhivei de Folklor');
      title = `${issueTitle} | Vol.${issue.volume} Nr.${issue.number}`;
      appendDynamicMeta('name', 'description', `${issueTitle} — ${issue.article_count} articole, ${issue.pages} pagini.`);
    }
  } else if (State.currentPage === 'public-home') {
    appendDynamicMeta('name', 'description', JOURNAL.description);
  }

  const canonical = `${getBaseUrl()}${canonicalPath}`;
  appendDynamicLink('canonical', canonical);
  document.title = title;
}

function extractJsonFromText(text='') {
  const trimmed = text.trim();
  if (!trimmed) return null;
  try { return JSON.parse(trimmed); } catch (_) {}
  const start = trimmed.indexOf('{');
  const end = trimmed.lastIndexOf('}');
  if (start >= 0 && end > start) {
    try { return JSON.parse(trimmed.slice(start, end + 1)); } catch (_) {}
  }
  return null;
}

async function runUnifiedSegmentation(provider, apiKey, model, sourceText) {
  const userPrompt = `${State.ai.skillRules}\n\nText brut issue:\n${sourceText}\n\nReturnează strict JSON cu cheia "articles".`;

  if (provider === 'openai') {
    const rsp = await fetch('https://api.openai.com/v1/responses', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${apiKey}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        model,
        temperature: 0,
        input: [
          { role: 'system', content: [{ type: 'input_text', text: 'Returnează strict JSON valid.' }] },
          { role: 'user', content: [{ type: 'input_text', text: userPrompt }] },
        ],
      }),
    });
    if (!rsp.ok) throw new Error(`OpenAI error ${rsp.status}`);
    const data = await rsp.json();
    const text = data.output_text || (data.output || [])
      .flatMap(item => item.content || [])
      .map(item => item.text || '')
      .join('\n');
    const parsed = extractJsonFromText(text);
    if (!parsed) throw new Error('OpenAI output invalid JSON');
    return parsed;
  }

  if (provider === 'anthropic') {
    const rsp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'content-type': 'application/json',
      },
      body: JSON.stringify({
        model,
        max_tokens: 2000,
        temperature: 0,
        system: 'Returnează strict JSON valid conform instrucțiunilor primite.',
        messages: [{ role: 'user', content: userPrompt }],
      }),
    });
    if (!rsp.ok) throw new Error(`Anthropic error ${rsp.status}`);
    const data = await rsp.json();
    const text = (data.content || []).map(part => part.text || '').join('\n');
    const parsed = extractJsonFromText(text);
    if (!parsed) throw new Error('Anthropic output invalid JSON');
    return parsed;
  }

  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;
  const rsp = await fetch(url, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [{ text: userPrompt }] }],
      generationConfig: { temperature: 0, responseMimeType: 'application/json' },
    }),
  });
  if (!rsp.ok) throw new Error(`Google error ${rsp.status}`);
  const data = await rsp.json();
  const text = (data.candidates || [])
    .flatMap(c => c.content?.parts || [])
    .map(p => p.text || '')
    .join('\n');
  const parsed = extractJsonFromText(text);
  if (!parsed) throw new Error('Google output invalid JSON');
  return parsed;
}

async function resolveIngestArticles() {
  const fallback = DB.getArticlesByIssue('1').map(art => ({ ...art }));
  if (!State.ingestUseAi) return fallback;

  const provider = State.ingestAiProvider || State.ai.provider || 'openai';
  const key = (State.ai.keys || {})[provider] || '';
  const model = (State.ai.models || {})[provider] || '';
  if (!key || !model) {
    toast(`Cheie/model lipsă pentru ${provider.toUpperCase()}. Folosesc fallback local.`, 'warning');
    return fallback;
  }

  try {
    const source = buildSegmentationSampleText();
    const data = await runUnifiedSegmentation(provider, key, model, source);
    const normalized = normalizeModelArticles(data.articles || []);
    if (!normalized.length) throw new Error('0 articole returnate');
    toast(`Segmentare AI finalizată (${provider.toUpperCase()}, ${normalized.length} articole).`, 'success');
    return normalized;
  } catch (err) {
    toast(`Eroare model ${provider.toUpperCase()}: ${err.message}. Fallback local activ.`, 'warning');
    return fallback;
  }
}

function runProcessingSimulation() {
  const steps = [15,35,55,75,90,100];
  const labels = ['Detectare structură PDF…','Extragere text și layout…','Segmentare articole…','Extragere metadate…','Decupare PDF-uri per articol…','Calcul scoruri de încredere…'];
  let stepIdx = 0;

  const interval = setInterval(()=>{
    if (stepIdx >= steps.length) {
      clearInterval(interval);
      setTimeout(async()=>{
        State.ingestExtracted = await resolveIngestArticles();
        State.ingestState = 'confirm';
        State.ingestProgress = 100;
        renderPage();
        toast(`Procesare completă — ${State.ingestExtracted.length} articole detectate!`,'success');
      }, 600);
      return;
    }
    State.ingestProgress = steps[stepIdx];
    const bar = document.getElementById('proc-bar');
    const label = document.getElementById('proc-step-label');
    if (bar) bar.style.width = State.ingestProgress+'%';
    if (label) label.textContent = labels[stepIdx];
    // re-render processing steps inline
    const stepsEl = document.getElementById('proc-steps');
    if (stepsEl) {
      const p = State.ingestProgress;
      stepsEl.innerHTML = [15,35,55,75,90,100].map((thresh,i)=>{
        const isDone = p >= thresh;
        const isActive = !isDone && (i===0 ? p>=0 : p>=steps[i-1]);
        return `<li class="${isDone?'done':isActive?'active':''}">
          <span class="step-icon">${isDone?'✓':isActive?'→':'○'}</span>${labels[i]}
        </li>`;
      }).join('');
    }
    stepIdx++;
  }, 700);
}

function generateExport() {
  if (State.role !== 'admin') {
    toast('Exportul XML complet este disponibil doar pentru administrator.', 'error');
    return;
  }
  const format = document.getElementById('export-format')?.value || 'doaj';
  const articles = DB.articles
    .filter(art => art.status === 'published')
    .sort((a, b) => Number(a.issue_id) - Number(b.issue_id) || Number(a.id) - Number(b.id));
  const baseUrl = document.getElementById('export-baseurl')?.value || 'https://www.iafar.ro/article/';
  const pdfUrl = document.getElementById('export-pdfurl')?.value || 'https://www.iafar.ro/pdf/';
  if (!articles.length) {
    toast('Nu există articole publicate pentru selecția curentă.', 'warning');
    return;
  }

  let xml = '';
  if (format === 'doaj') {
    xml = buildDoajXml(articles, baseUrl, pdfUrl);
  } else {
    xml = buildCrossrefXml(articles, format === 'crossref' ? '4.4.2' : '5.3.1');
  }

  State.currentXML = xml;
  State.currentXMLFormat = format;

  const el = document.getElementById('xml-content');
  if (el) {
    el.textContent = xml;
  }
  const title = document.querySelector('#xml-modal .modal-title');
  if (title) {
    title.textContent = format === 'doaj' ? 'Export DOAJ XML' : `Export Crossref XML (${format === 'crossref' ? '4.4.2' : '5.3.1'})`;
  }
  document.getElementById('xml-modal').classList.remove('hidden');
}

function serializeCsvRows(rows) {
  if (!rows || !rows.length) return '';
  const headers = Object.keys(rows[0]);
  const lines = [
    headers.join(','),
    ...rows.map(row => headers.map(key => `"${String(row[key] ?? '').replace(/"/g, '""')}"`).join(',')),
  ];
  return lines.join('\n');
}

function backupTimestamp() {
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}`;
}

function normalizedServerApiBase() {
  const raw = String(State.serverApiBase || '').trim();
  if (!raw) return '';
  return raw.replace(/\/+$/, '');
}

function setServerApiBase(value='') {
  State.serverApiBase = String(value || '').trim();
  localStorage.setItem(STORAGE_KEYS.serverApiBase, State.serverApiBase);
}

function buildServerApiUrl(path='') {
  const base = normalizedServerApiBase();
  const suffix = String(path || '').startsWith('/') ? String(path || '') : `/${String(path || '')}`;
  if (base) return `${base}${suffix}`;
  return suffix;
}

async function fetchServerJson(path, options={}) {
  const url = buildServerApiUrl(path);
  const rsp = await fetch(url, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      ...(options.headers || {}),
    },
  });
  if (!rsp.ok) {
    throw new Error(`HTTP ${rsp.status}`);
  }
  return rsp.json();
}

function getAdminServerStartCommand() {
  return 'node scripts/admin_csv_server.js';
}

async function checkServerAvailability(options={}) {
  const { timeoutMs = 1500 } = options || {};
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), Math.max(300, Number(timeoutMs) || 1500));
  try {
    const rsp = await fetch(buildServerApiUrl('/api/health'), {
      method: 'GET',
      headers: { Accept: 'application/json' },
      signal: controller.signal,
    });
    if (!rsp.ok) throw new Error(`HTTP ${rsp.status}`);
    await rsp.json().catch(() => ({}));
    State.serverSyncLastError = '';
    return true;
  } catch (err) {
    State.serverSyncLastError = String(err?.message || err);
    return false;
  } finally {
    clearTimeout(timer);
  }
}

async function ensureServerForAdminEdit(options={}) {
  const { interactive = true } = options || {};
  const healthy = await checkServerAvailability({ timeoutMs: 1300 });
  if (healthy) return true;
  if (!interactive) return false;

  const cmd = getAdminServerStartCommand();
  try {
    if (navigator?.clipboard?.writeText) await navigator.clipboard.writeText(cmd);
  } catch (_) {}

  const apiBase = normalizedServerApiBase() || '(same-origin)';
  window.alert(
`Serverul de persistență CSV nu rulează.

Browserul nu poate porni automat procese locale.
Pornește serverul din Terminal, în folderul proiectului:
${cmd}

API curent: ${apiBase}
Comanda a fost copiată în clipboard (dacă browserul permite).`
  );
  return false;
}

function parseIsoMs(value='') {

async function syncStateFromServerIfAvailable(options={}) {
  const { silent = true } = options || {};
  try {
    const payload = await fetchServerJson('/api/state');
    const meta = payload?.meta || {};
    if (meta.schema !== 'academcms-csv-state-v1') return false;
    if (!Array.isArray(payload.issues) || !Array.isArray(payload.articles)) return false;

    const serverSavedAt = parseIsoMs(meta.saved_at || '');
    const localSavedAt = parseIsoMs(State.persistentAdminSavedAt || '');
    if (localSavedAt && serverSavedAt && localSavedAt > serverSavedAt) {
      return false;
    }

    if (payload.journal && typeof payload.journal === 'object') {
      Object.assign(JOURNAL, payload.journal);
    }
    DB.issues = payload.issues.map(issue => ({
      ...issue,
      id: String(issue.id || ''),
      series: issue.series || 'seria-3',
    }));
    DB.articles = payload.articles.map(article => ({
      ...article,
      id: String(article.id || ''),
      issue_id: String(article.issue_id || ''),
      series: article.series || '',
    }));

    State.serverSyncLastAt = String(meta.saved_at || new Date().toISOString());
    State.serverSyncLastError = '';
    persistAdminDataSnapshot('server-state-hydrate', { silent: true });
    renderTopbar();
    renderPage();
    updateHeadMetadata();
    if (!silent) toast(`Stare încărcată din server: ${DB.issues.length} numere, ${DB.articles.length} articole.`, 'success');
    return true;
  } catch (err) {
    State.serverSyncLastError = String(err?.message || err);
    if (!silent) toast(`Server indisponibil: ${State.serverSyncLastError}`, 'warning');
    return false;
  }
}

async function persistStateToServer(reason='manual-save', options={}) {
  const { silent = false } = options || {};
  try {
    const payload = {
      reason: String(reason || 'manual-save'),
      journal: { ...JOURNAL },
      issues: DB.issues.map(issue => ({ ...issue, id: String(issue.id || ''), series: issue.series || 'seria-3' })),
      articles: DB.articles.map(article => ({
        ...article,
        id: String(article.id || ''),
        issue_id: String(article.issue_id || ''),
        series: article.series || '',
      })),
    };
    const result = await fetchServerJson('/api/state/save', {
      method: 'POST',
      body: JSON.stringify(payload),
    });
    State.serverSyncLastAt = String(result?.meta?.saved_at || new Date().toISOString());
    State.serverSyncLastError = '';
    if (!silent) {
      toast(`Persistat pe server: ${result?.counts?.issues || payload.issues.length} numere, ${result?.counts?.articles || payload.articles.length} articole.`, 'success');
    }
    return true;
  } catch (err) {
    State.serverSyncLastError = String(err?.message || err);
    if (!silent) {
      toast(`Nu am putut salva pe server (${State.serverSyncLastError}).`, 'warning');
    }
    return false;
  }
}

async function writeCsvBackupToFolder(filename, content, stamp) {
  try {
    const root = await ensureBackupRootHandle();
    if (!root) return false;
    const backupsDir = await root.getDirectoryHandle('backups', { create: true });
    const runDir = await backupsDir.getDirectoryHandle(stamp, { create: true });
    const fileHandle = await runDir.getFileHandle(filename, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(content);
    await writable.close();
    return true;

  });
  saveCsvBackups(backups);

function parseBackupTimestampValue(stamp='') {
  const raw = String(stamp || '').trim();
  const m = raw.match(/^(\d{4})-(\d{2})-(\d{2})_(\d{2})-(\d{2})-(\d{2})$/);
  if (!m) return NaN;
  const iso = `${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}`;
  const t = Date.parse(iso);
  return Number.isFinite(t) ? t : NaN;
}

function backupEntryTime(entry={}) {
  const fromSavedAt = Date.parse(String(entry?.saved_at || ''));
  if (Number.isFinite(fromSavedAt)) return fromSavedAt;
  return parseBackupTimestampValue(entry?.timestamp || '');
}

function getLatestCsvBackup(filename='articles.csv', maxAgeMinutes=0) {
  const target = String(filename || '').trim().toLowerCase();
  const now = Date.now();
  const maxAgeMs = Number(maxAgeMinutes) > 0 ? Number(maxAgeMinutes) * 60 * 1000 : 0;
  const backups = loadCsvBackups()
    .filter(entry => String(entry?.filename || '').trim().toLowerCase() === target && String(entry?.content || '').trim())
    .map(entry => ({ ...entry, _time: backupEntryTime(entry) }))
    .filter(entry => Number.isFinite(entry._time))
    .sort((a, b) => b._time - a._time);
  if (!backups.length) return null;
  if (maxAgeMs > 0) {
    const recent = backups.find(entry => (now - entry._time) <= maxAgeMs);
    return recent || null;
  }
  return backups[0];
}

async function restoreLatestArticlesFromLocalBackup(maxAgeMinutes=60) {
  const windows = [];
  if (Number(maxAgeMinutes) > 0) windows.push(Number(maxAgeMinutes));
  windows.push(120, 360, 1440); // fallback gradual: 2h, 6h, 24h
  const tried = [];
  let entry = null;
  for (const win of windows) {
    if (tried.includes(win)) continue;
    tried.push(win);
    entry = getLatestCsvBackup('articles.csv', win);
    if (entry) break;
  }
  if (!entry) {
    toast('Nu există backup local articles.csv în ultimele 24h.', 'error');
    return;
  }
  const parsed = parseCSV(String(entry.content || ''));
  if (!parsed.length) {
    toast('Backup-ul local este gol sau invalid.', 'error');
    return;
  }
  DB.articles = parsed.map(article => ({
    ...article,
    id: String(article.id || ''),
    issue_id: String(article.issue_id || ''),
    series: article.series || '',
  }));
  persistAdminDataSnapshot('restore-articles-backup', { silent: true });
  const serverPersisted = await persistStateToServer('restore-articles-backup', { silent: true });
  toast(`Backup restaurat: ${DB.articles.length} articole (${entry.timestamp || entry.saved_at || 'fără timestamp'}). Datele sunt persistente local${serverPersisted ? ' și pe server' : ''}.`, 'success');
  renderTopbar();
  renderPage();
  updateHeadMetadata();
}

async function saveAdminArticleEdits(articleId) {
  const art = DB.getArticle(articleId);
  if (!art) {
    toast('Articolul nu a fost găsit.', 'error');
    return;
  }

  const getValue = id => document.getElementById(id)?.value?.trim?.() || '';
  const keywords = getValue('ae-keywords');
  const normalizedKeywords = keywords
    .split(',')
    .map(item => item.trim())
    .filter(Boolean)
    .join(', ');
  const abstractValue = getValue('ae-abstract');
  const abstractSourceRaw = getValue('ae-abstract-source');
  const langToAbstractField = {
    ro: 'abstract_ro',
    en: 'abstract_en',
    de: 'abstract_de',
    fr: 'abstract_fr',
  };
  const abstractTargetField = ['abstract_ro', 'abstract_en', 'abstract_de', 'abstract_fr'].includes(abstractSourceRaw)
    ? abstractSourceRaw
    : (langToAbstractField[getValue('ae-language')] || 'abstract_en');

  art.title = getValue('ae-title');
  art.authors = getValue('ae-authors');
  art.affiliations = getValue('ae-affiliations');
  art.emails = getValue('ae-emails');
  art.pages_start = getValue('ae-pages-start');
  art.pages_end = getValue('ae-pages-end');
  art[abstractTargetField] = abstractValue;
  art.keywords_ro = normalizedKeywords;
  art.keywords_en = normalizedKeywords;
  art.keywords_fr = normalizedKeywords;
  art.keywords_de = normalizedKeywords;
  art.language = getValue('ae-language') || art.language || 'ro';
  art.status = getValue('ae-status') || art.status || 'published';

  const persisted = persistAdminDataSnapshot('admin-article-edit', { silent: true });
  const serverPersisted = await persistStateToServer('admin-article-edit', { silent: true });
  const csv = serializeCsvRows(DB.articles);
  const stamp = backupTimestamp();
  const writtenToFolder = await writeCsvBackupToFolder('articles.csv', csv, stamp);
  if (!writtenToFolder) {
    writeCsvBackupToLocalStorage('articles.csv', csv, stamp);
    const segments = [
      'Modificările au fost salvate',
      persisted ? 'persistent în browser' : '',
      serverPersisted ? 'și pe server' : 'fără server',
      'Backup local (timestamped) stocat în browser.',
    ].filter(Boolean);
    toast(segments.join(' '), serverPersisted || persisted ? 'success' : 'warning');
    return;
  }
  const segments = [
    'Modificările au fost salvate',
    persisted ? 'persistent în browser' : '',
    serverPersisted ? 'și pe server' : 'fără server',
    `Backup creat în folderul backups/${stamp}.`,
  ].filter(Boolean);
  toast(segments.join(' '), serverPersisted || persisted ? 'success' : 'warning');
}

  } catch (err) {
    if (err?.name !== 'AbortError') {
      toast('Eroare la salvarea manifest-ului: ' + (err?.message || err), 'error');
    }
  }
}

function downloadArticlesCSV() {
  const csv = serializeCsvRows(DB.articles);
  downloadFile(csv, 'articles.csv', 'text/csv');
  toast('CSV articole descărcat!','success');
}

function downloadIssuesCSV() {
  const csv = serializeCsvRows(DB.issues);
  downloadFile(csv, 'issues.csv', 'text/csv');
  toast('CSV numere descărcat!','success');
}

function downloadFile(content, filename, type) {
  const blob = new Blob([content], {type});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

// ═══════════════════════════════════════════════════════════════════════
//  ARTICLE MODAL (Public)

function openArticleModal(id) {
  const art = DB.getArticle(id);
  if (!art) return;
  const issue = DB.getIssue(art.issue_id);

  document.getElementById('article-modal-title').textContent = art.title;
  document.getElementById('article-modal-body').innerHTML = `
    <div style="margin-bottom:16px;">
      ${badgeStatus('published')}
      <span class="badge badge-blue" style="margin-left:6px;">${(art.language||'ro').toUpperCase()}</span>
    </div>
    <div style="margin-bottom:16px;">
      <div class="text-mono text-sm text-muted mb-8">Autori</div>
      <div style="font-size:0.92rem;">${art.authors}</div>
      ${art.affiliations?`<div class="text-sm text-muted" style="margin-top:4px;">${art.affiliations}</div>`:''}
    </div>
    <div style="display:flex;gap:24px;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--bg3);">
      <div><div class="text-mono text-sm text-muted">Număr</div><div class="text-sm">Vol.${issue?.volume} Nr.${issue?.number}/${issue?.year}</div></div>
      <div><div class="text-mono text-sm text-muted">Pagini</div><div class="text-sm">${art.pages_start}–${art.pages_end}</div></div>
      <div><div class="text-mono text-sm text-muted">Publicat</div><div class="text-sm">${issue?.date_published||'—'}</div></div>
    </div>
    ${(art.abstract_en || art.abstract_ro)?`<div class="text-mono text-sm text-muted mb-8">Rezumat</div><p style="font-size:0.9rem;line-height:1.7;margin-bottom:16px;">${art.abstract_en || art.abstract_ro}</p>`:''}
    <div style="display:flex;flex-wrap:wrap;gap:4px;">
      ${Array.from(new Set([...(art.keywords_ro||'').split(','), ...(art.keywords_en||'').split(',')].map(k=>k.trim()).filter(Boolean))).map(k=>`<span class="keyword-tag">${k}</span>`).join('')}
    </div>`;

  document.getElementById('article-modal-pdf').onclick = ()=>toast(`PDF descărcat (pp.${art.pages_start}–${art.pages_end}) — simulat`,'success');
  document.getElementById('article-modal').classList.remove('hidden');
}
function closeArticleModal() { document.getElementById('article-modal').classList.add('hidden'); }

// ═══════════════════════════════════════════════════════════════════════
//  TOAST NOTIFICATIONS
// ═══════════════════════════════════════════════════════════════════════

function toast(msg, type='') {
  const container = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icons = {
    success:'solar:check-circle-bold-duotone',
    error:'solar:close-circle-bold-duotone',
    warning:'solar:danger-circle-bold-duotone',
    info:'solar:info-circle-bold-duotone'
  };
  el.innerHTML = `<span>${solarIcon(icons[type] || icons.info)}</span><span>${msg}</span>`;
  container.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(100%)'; el.style.transition='all 0.3s'; setTimeout(()=>el.remove(),300); }, 3500);
}

function attachPageListeners() {
  // Rating buttons in review form
  document.querySelectorAll('.review-label').forEach(label=>{
    label.addEventListener('mouseenter', ()=>{ if (!label.previousElementSibling.checked) label.style.background='var(--bg2)'; });
    label.addEventListener('mouseleave', ()=>{ if (!label.previousElementSibling.checked) label.style.background=''; });
  });
}

function selectTemplate(idx) {
  document.querySelectorAll('[id^="tmpl-"]').forEach(el=>{
    el.style.borderLeftColor='transparent';
    el.style.background='';
    el.style.fontWeight='';
  });
  const el = document.getElementById('tmpl-'+idx);
  if (el) {
    el.style.borderLeftColor='var(--accent)';
    el.style.background='var(--accent-bg)';
    el.style.fontWeight='700';
  }
}
