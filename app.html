<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anuarul Arhivei de Folclor — Platformă editorială</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<style>
:root {
  --sunflower-gold: #f1b22b;
  --olive-bark: #644917;
  --soft-apricot: #f8dab5;
  --seashell: #fdf5ed;
  --bg: #fdf5ed;
  --bg2: #f8dab5;
  --bg3: #efd2ad;
  --border: #d8b987;
  --text: #3d2c0e;
  --text2: #6b5021;
  --text3: #9a7640;
  --accent: #f1b22b;
  --accent-light: #d99f25;
  --accent-bg: #fff0dc;
  --gold: #f1b22b;
  --gold-bg: #fff0dc;
  --success: #644917;
  --success-bg: #f7e6cd;
  --danger: #8a611a;
  --danger-bg: #fff0dc;
  --warning: #644917;
  --warning-bg: #fff0dc;
  --sidebar-bg: #644917;
  --sidebar-text: #f8dab5;
  --sidebar-hover: #7a5920;
  --sidebar-active: #f1b22b;
  --sidebar-accent: #f8dab5;
  --header-h: 60px;
  --sidebar-w: 248px;
  --radius: 6px;
  --shadow: 0 3px 10px rgba(100,73,23,0.16);
  --shadow-lg: 0 10px 34px rgba(100,73,23,0.2);
  --font-serif: 'Alegreya Sans', system-ui, sans-serif;
  --font-sans: 'Alegreya Sans', system-ui, sans-serif;
  --font-mono: 'Alegreya Sans', system-ui, sans-serif;
  --transition: 0.18s ease;

  /* Series palettes */
  --s1-bg: #e7f3ea;
  --s1-border: #b7d6bf;
  --s1-accent: #6ea883;
  --s1-text: #254c36;
  --s1-text2: rgba(37,76,54,0.82);
  --s1-badge-bg: #d7ebdd;
  --s1-badge-text: #2d6445;
  --s1-hover: #dff0e4;
  --s1-card-bg: #edf7f0;

  --s2-bg: #e6edf8;
  --s2-border: #8ea3c0;
  --s2-accent: #466a93;
  --s2-text: #2b4463;
  --s2-text2: rgba(43,68,99,0.8);
  --s2-badge-bg: #d7e2f2;
  --s2-badge-text: #2f4f78;
  --s2-hover: #dae5f5;
  --s2-card-bg: #ecf2fb;

  --s3-bg: #f1b22b;
  --s3-border: #644917;
  --s3-accent: #f1b22b;
  --s3-text: #644917;
  --s3-text2: rgba(100,73,23,0.88);
  --s3-badge-bg: #f7e6cd;
  --s3-badge-text: #644917;
  --s3-hover: #e8a520;
  --s3-card-bg: #f1b22b;
}

/* ─── SERIES CARD THEMES ─── */
.issue-card.series-seria-1 {
  background: var(--s1-card-bg);
  border-color: var(--s1-border);
  color: var(--s1-text);
}
.issue-card.series-seria-1:hover {
  border-color: var(--s1-accent);
  box-shadow: var(--shadow-lg);
  background: var(--s1-hover);
}
.issue-card.series-seria-1 .issue-vol,
.issue-card.series-seria-1 .issue-meta {
  color: var(--s1-text2);
}
.issue-card.series-seria-1 .series-badge {
  background: var(--s1-badge-bg);
  color: var(--s1-badge-text);
}

.issue-card.series-seria-2 {
  background: var(--s2-card-bg);
  border-color: var(--s2-border);
  color: var(--s2-text);
}
.issue-card.series-seria-2:hover {
  border-color: var(--s2-accent);
  box-shadow: var(--shadow-lg);
  background: var(--s2-hover);
}
.issue-card.series-seria-2 .issue-vol,
.issue-card.series-seria-2 .issue-meta {
  color: var(--s2-text2);
}
.issue-card.series-seria-2 .series-badge {
  background: var(--s2-badge-bg);
  color: var(--s2-badge-text);
}

.issue-card.series-seria-3 {
  background: var(--s3-card-bg);
  border-color: var(--s3-border);
  color: var(--s3-text);
}
.issue-card.series-seria-3:hover {
  border-color: var(--s3-border);
  box-shadow: var(--shadow-lg);
  background: var(--s3-hover);
}
.issue-card.series-seria-3 .issue-vol,
.issue-card.series-seria-3 .issue-meta {
  color: var(--s3-text2);
}
.issue-card.series-seria-3 .series-badge {
  background: var(--s3-badge-bg);
  color: var(--s3-badge-text);
}

.series-badge {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 0.62rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 3px;
  font-weight: 600;
}

.series-flow-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 20px 0 10px 0;
  padding: 0;
}
.series-flow-header:first-child {
  margin-top: 0;
}
.series-flow-header .series-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}
.series-flow-label {
  font-family: var(--font-serif);
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--text);
}
.series-flow-count {
  font-size: 0.78rem;
  color: var(--text3);
  font-weight: 400;
}
.series-dot-seria-1 { background: var(--s1-accent); }
.series-dot-seria-2 { background: var(--s2-accent); }
.series-dot-seria-3 { background: var(--s3-accent); }

/* TOC panel theme for series */
.issue-panel.toc-seria-1 {
  background: var(--s1-card-bg);
  border-color: var(--s1-border);
  --accent-strong: var(--s1-accent);
}
.issue-panel.toc-seria-1 .card-header {
  background: var(--s1-card-bg);
  border-bottom-color: var(--s1-border);
}
.issue-panel.toc-seria-1 .card-body {
  background: #f4fbf6;
}
.issue-panel.toc-seria-1 .toc-item {
  border-bottom-color: rgba(110, 168, 131, 0.22);
}
.issue-panel.toc-seria-1 .toc-item:hover {
  background: var(--s1-hover);
}
.issue-panel.toc-seria-1 .toc-item-title { color: var(--s1-accent); }
.issue-panel.toc-seria-1 .toc-pages,
.issue-panel.toc-seria-1 .toc-item-authors {
  color: var(--s1-text2);
}
.issue-panel.toc-seria-1 .series-badge {
  background: var(--s1-badge-bg);
  color: var(--s1-badge-text);
}
.issue-panel.toc-seria-1 .badge-gray {
  background: #e5f3e9;
  color: #2f5f44;
}
.issue-panel.toc-seria-1 .badge-green {
  background: #d7ebdd;
  color: #2d6445;
}
.issue-panel.toc-seria-1 .btn-ghost {
  color: var(--s1-accent);
}
.issue-panel.toc-seria-1 .btn-ghost:hover {
  background: #e5f3e9;
}

.issue-panel.toc-seria-2 {
  background: var(--s2-card-bg);
  border-color: var(--s2-border);
  --accent-strong: var(--s2-accent);
}
.issue-panel.toc-seria-2 .card-header {
  background: var(--s2-card-bg);
  border-bottom-color: var(--s2-border);
}
.issue-panel.toc-seria-2 .card-body {
  background: #f4f8fe;
}
.issue-panel.toc-seria-2 .toc-item {
  border-bottom-color: rgba(70, 106, 147, 0.2);
}
.issue-panel.toc-seria-2 .toc-item:hover {
  background: var(--s2-hover);
}
.issue-panel.toc-seria-2 .toc-item-title { color: var(--s2-accent); }
.issue-panel.toc-seria-2 .toc-pages,
.issue-panel.toc-seria-2 .toc-item-authors {
  color: var(--s2-text2);
}
.issue-panel.toc-seria-2 .series-badge {
  background: var(--s2-badge-bg);
  color: var(--s2-badge-text);
}
.issue-panel.toc-seria-2 .badge-gray {
  background: #e2ebf8;
  color: #365a86;
}
.issue-panel.toc-seria-2 .badge-green {
  background: #d7e2f2;
  color: #2f4f78;
}
.issue-panel.toc-seria-2 .btn-ghost {
  color: var(--s2-accent);
}
.issue-panel.toc-seria-2 .btn-ghost:hover {
  background: #e2ebf8;
}

.issue-panel.toc-seria-3 {
  background: var(--s3-card-bg);
  border-color: var(--s3-border);
  --accent-strong: var(--s3-border);
}
.issue-panel.toc-seria-3 .card-header {
  background: var(--s3-card-bg);
  border-bottom-color: var(--s3-border);
}
.issue-panel.toc-seria-3 .card-body {
  background: #fdf2df;
}
.issue-panel.toc-seria-3 .toc-item {
  border-bottom-color: rgba(100, 73, 23, 0.2);
}
.issue-panel.toc-seria-3 .toc-item:hover {
  background: var(--s3-hover);
}
.issue-panel.toc-seria-3 .toc-item-title {
  color: var(--s3-border);
}
.issue-panel.toc-seria-3 .toc-pages,
.issue-panel.toc-seria-3 .toc-item-authors {
  color: var(--s3-text2);
}
.issue-panel.toc-seria-3 .series-badge {
  background: var(--s3-badge-bg);
  color: var(--s3-badge-text);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body {
  font-family: var(--font-sans);
  background:
    radial-gradient(circle at top right, rgba(241,178,43,0.18), transparent 40%),
    radial-gradient(circle at bottom left, rgba(248,218,181,0.24), transparent 36%),
    var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ─── APP SHELL ─── */
#app { display: flex; min-height: 100vh; }

/* ─── SIDEBAR ─── */
#sidebar {
  width: var(--sidebar-w);
  background: var(--sidebar-bg);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
  transition: transform var(--transition);
}
#sidebar-logo {
  padding: 20px 20px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
#sidebar-logo .logo-mark {
  font-family: var(--font-serif);
  font-size: 1.15rem;
  color: var(--soft-apricot);
  font-weight: 700;
  letter-spacing: 0.02em;
  line-height: 1.2;
}
#sidebar-logo .logo-sub {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--sidebar-text);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-top: 3px;
}

#role-switcher {
  margin: 12px 14px;
  padding: 8px 12px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--radius);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--sidebar-text);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  transition: background var(--transition);
}
#role-switcher:hover { background: rgba(255,255,255,0.10); }
#role-switcher .role-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--sidebar-accent);
  flex-shrink: 0;
}

#sidebar-nav { flex: 1; padding: 8px 0; overflow-y: auto; }
.nav-section { padding: 8px 14px 4px; }
.nav-section-label {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(248,218,181,0.65);
  font-weight: 600;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 20px;
  color: var(--sidebar-text);
  text-decoration: none;
  font-size: 0.88rem;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: all var(--transition);
  margin: 1px 0;
}
.nav-item:hover { background: var(--sidebar-hover); color: var(--soft-apricot); }
.nav-item.active {
  background: var(--sidebar-active);
  color: var(--olive-bark);
  border-left-color: var(--sidebar-accent);
}
.nav-item .nav-icon { width: 18px; text-align: center; font-size: 1rem; flex-shrink: 0; }
.nav-badge {
  margin-left: auto;
  background: var(--sidebar-accent);
  color: var(--olive-bark);
  font-family: var(--font-mono);
  font-size: 0.65rem;
  padding: 1px 6px;
  border-radius: 10px;
  font-weight: 600;
}

#sidebar-footer {
  padding: 16px;
  border-top: 1px solid rgba(255,255,255,0.08);
  font-size: 0.78rem;
  color: rgba(248,218,181,0.72);
  font-family: var(--font-mono);
}

iconify-icon {
  width: 1.05em;
  height: 1.05em;
  vertical-align: -0.16em;
}
.solar-emoji {
  color: var(--olive-bark);
}
#sidebar iconify-icon.solar-emoji { color: var(--soft-apricot); }
#sidebar .nav-item.active iconify-icon.solar-emoji { color: var(--olive-bark); }
.btn iconify-icon.solar-emoji { margin-right: 6px; color: currentColor; }
.toast iconify-icon.solar-emoji { color: #fff; margin-right: 4px; }

/* ─── MAIN AREA ─── */
#main-wrap {
  margin-left: var(--sidebar-w);
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* ─── TOPBAR ─── */
#topbar {
  height: var(--header-h);
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 32px;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 50;
}
#topbar-breadcrumb {
  flex: 1;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text2);
  letter-spacing: 0.04em;
}
#topbar-breadcrumb .crumb-sep { margin: 0 8px; opacity: 0.5; }
#topbar-breadcrumb .crumb-current { color: var(--text); font-weight: 600; }
#topbar-actions { display: flex; align-items: center; gap: 12px; }

/* ─── CONTENT ─── */
#page-content {
  flex: 1;
  padding: 36px 40px;
  max-width: 1100px;
  width: 100%;
  margin: 0 auto;
}

/* ─── TYPOGRAPHY ─── */
.page-title {
  font-family: var(--font-serif);
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
  line-height: 1.2;
}
.page-subtitle { color: var(--text2); font-size: 0.92rem; margin-bottom: 32px; }
.section-title {
  font-family: var(--font-serif);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 16px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--border);
}
h3.card-title { font-family: var(--font-serif); font-size: 1rem; font-weight: 700; }

/* ─── BUTTONS ─── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 18px;
  border-radius: var(--radius);
  font-family: var(--font-sans);
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all var(--transition);
  text-decoration: none;
  white-space: nowrap;
}
.btn-primary { background: var(--accent); color: var(--olive-bark); border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-light); border-color: var(--accent-light); }
.btn-secondary { background: var(--bg2); color: var(--text); border-color: var(--border); }
.btn-secondary:hover { background: var(--bg3); }
.btn-gold { background: var(--gold); color: var(--olive-bark); border-color: var(--gold); }
.btn-gold:hover { background: var(--olive-bark); }
.btn-danger { background: var(--danger); color: var(--seashell); border-color: var(--danger); }
.btn-success { background: var(--success); color: var(--seashell); border-color: var(--success); }
.btn-ghost { background: transparent; color: var(--accent); border-color: transparent; padding-left: 4px; }
.btn-ghost:hover { background: var(--accent-bg); }
.btn-sm { padding: 5px 12px; font-size: 0.78rem; }
.btn-icon { padding: 7px 10px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ─── CARDS ─── */
.card {
  background: var(--seashell);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.card-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.card-body { padding: 20px; }
.card-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  background: var(--bg);
  border-radius: 0 0 var(--radius) var(--radius);
  display: flex;
  align-items: center;
  gap: 10px;
}

/* ─── FORM ─── */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.form-field { display: flex; flex-direction: column; gap: 5px; }
.form-field.full { grid-column: 1 / -1; }
label.field-label {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--text2);
  font-weight: 600;
}
.field-req { color: var(--danger); margin-left: 2px; }
input[type="text"], input[type="email"], input[type="number"], input[type="date"],
input[type="url"], textarea, select {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 9px 12px;
  font-family: var(--font-sans);
  font-size: 0.9rem;
  color: var(--text);
  width: 100%;
  transition: border-color var(--transition), box-shadow var(--transition);
  outline: none;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(30,58,110,0.1);
  background: #fff;
}
textarea { resize: vertical; min-height: 90px; }
.field-hint { font-size: 0.78rem; color: var(--text3); }

/* ─── CONFIDENCE ─── */
.conf-bar {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 0.7rem;
}
.conf-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.conf-hi { background: var(--success); }
.conf-mid { background: var(--gold); }
.conf-lo { background: var(--danger); }
.field-conf-lo input, .field-conf-lo textarea {
  border-color: var(--gold);
  background: var(--gold-bg);
}
.field-conf-vlo input, .field-conf-vlo textarea {
  border-color: var(--danger);
  background: var(--danger-bg);
}

/* ─── BADGES / TAGS ─── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 9px;
  border-radius: 20px;
  font-family: var(--font-mono);
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.badge-blue { background: var(--accent-bg); color: var(--accent); }
.badge-gold { background: var(--gold-bg); color: var(--gold); }
.badge-green { background: var(--success-bg); color: var(--success); }
.badge-red { background: var(--danger-bg); color: var(--danger); }
.badge-gray { background: var(--bg3); color: var(--text2); }
.keyword-tag {
  display: inline-block;
  padding: 3px 10px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 3px;
  font-size: 0.78rem;
  color: var(--text);
  font-family: var(--font-mono);
  margin: 2px;
}
button.keyword-tag {
  cursor: pointer;
}
button.keyword-tag:hover {
  border-color: var(--accent);
  background: var(--accent-bg);
}
button.keyword-tag.active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--olive-bark);
}

/* ─── TABLE ─── */
.tbl-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; background: var(--seashell); }
th {
  background: var(--bg2);
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--text2);
  font-weight: 600;
  padding: 10px 16px;
  text-align: left;
  border-bottom: 2px solid var(--border);
  white-space: nowrap;
}
td {
  padding: 11px 16px;
  font-size: 0.88rem;
  border-bottom: 1px solid var(--bg3);
  vertical-align: middle;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--bg); }
.tbl-actions { display: flex; gap: 6px; align-items: center; }
.dashboard-issues-table .dashboard-issue-row td {
  transition: background var(--transition);
}
.dashboard-issues-table .dashboard-issue-row.series-row-seria-1 td { background: #f7fcf8; }
.dashboard-issues-table .dashboard-issue-row.series-row-seria-2 td { background: #f6f9fe; }
.dashboard-issues-table .dashboard-issue-row.series-row-seria-3 td { background: #fff9ef; }
.dashboard-issues-table .dashboard-issue-row td:first-child {
  border-left: 3px solid transparent;
}
.dashboard-issues-table .dashboard-issue-row.series-row-seria-1 td:first-child { border-left-color: var(--s1-accent); }
.dashboard-issues-table .dashboard-issue-row.series-row-seria-2 td:first-child { border-left-color: var(--s2-accent); }
.dashboard-issues-table .dashboard-issue-row.series-row-seria-3 td:first-child { border-left-color: var(--s3-border); }
.dashboard-series-chip {
  margin-left: 8px;
}
.issue-view-btn-seria-1 {
  border-color: var(--s1-accent);
  background: #e5f3e9;
  color: #2f5f44;
}
.issue-view-btn-seria-1:hover {
  background: #dff0e4;
}
.issue-view-btn-seria-2 {
  border-color: var(--s2-accent);
  background: #e2ebf8;
  color: #2f4f78;
}
.issue-view-btn-seria-2:hover {
  background: #d7e2f2;
}
.issue-view-btn-seria-3 {
  border-color: var(--s3-border);
  background: #f7e6cd;
  color: var(--s3-border);
}
.issue-view-btn-seria-3:hover {
  background: #f3ddb7;
}

/* ─── STATS GRID ─── */
.stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin-bottom: 32px; }
.stat-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
}
.stat-value {
  font-family: var(--font-serif);
  font-size: 2rem;
  font-weight: 700;
  color: var(--accent);
  line-height: 1;
  margin-bottom: 4px;
}
.stat-label {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text2);
}
.stat-trend { font-size: 0.78rem; color: var(--success); margin-top: 6px; }

/* ─── PROGRESS ─── */
.progress-wrap { background: var(--bg3); border-radius: 4px; height: 6px; overflow: hidden; }
.progress-bar { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.4s ease; }
.progress-bar.gold { background: var(--gold); }
.progress-bar.green { background: var(--success); }

/* ─── INGEST SPECIFIC ─── */
.upload-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 60px 32px;
  text-align: center;
  cursor: pointer;
  transition: all var(--transition);
  background: var(--bg);
  position: relative;
}
.upload-zone:hover, .upload-zone.drag-over {
  border-color: var(--accent);
  background: var(--accent-bg);
}
.upload-zone input[type="file"] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
}
.upload-icon { font-size: 3rem; margin-bottom: 12px; }
.upload-title { font-family: var(--font-serif); font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; }
.upload-hint { color: var(--text2); font-size: 0.85rem; }

.processing-state { text-align: center; padding: 48px 32px; }
.processing-spinner {
  width: 48px; height: 48px;
  border: 4px solid var(--bg3);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
  margin: 0 auto 20px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.processing-steps { list-style: none; text-align: left; max-width: 320px; margin: 24px auto 0; }
.processing-steps li {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0;
  font-size: 0.88rem;
  color: var(--text2);
  border-bottom: 1px solid var(--bg3);
}
.processing-steps li.done { color: var(--success); }
.processing-steps li.active { color: var(--text); font-weight: 700; }
.step-icon { width: 20px; text-align: center; }

/* ─── ARTICLE INGEST CARD ─── */
.article-ingest-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 16px;
  overflow: hidden;
}
.article-ingest-header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 20px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
}
.article-num {
  font-family: var(--font-serif);
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--accent);
  min-width: 28px;
}
.article-ingest-title { flex: 1; font-weight: 700; font-size: 0.95rem; }
.article-ingest-pages {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--text2);
}
.article-ingest-body { padding: 20px; display: none; }
.article-ingest-body.open { display: block; }

/* ─── PUBLIC VIEWS ─── */
.journal-hero {
  background: var(--sidebar-bg);
  color: #fff;
  padding: 64px 48px;
  border-radius: var(--radius);
  margin-bottom: 32px;
  position: relative;
  overflow: hidden;
}
.journal-hero::before {
  content: '';
  position: absolute;
  right: -40px; top: -40px;
  width: 300px; height: 300px;
  border-radius: 50%;
  background: rgba(74,143,212,0.08);
}
.journal-hero .journal-issn {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--sidebar-accent);
  margin-bottom: 12px;
}
.journal-hero h1 {
  font-family: var(--font-serif);
  font-size: 2.2rem;
  line-height: 1.2;
  margin-bottom: 12px;
  max-width: 600px;
}
.journal-hero p { color: rgba(255,255,255,0.7); font-size: 0.95rem; max-width: 500px; line-height: 1.6; }
.home-page {
  max-width: 1040px;
  margin: 0 auto;
  text-align: center;
}
.home-page .journal-hero {
  margin-left: auto;
  margin-right: auto;
  text-align: center;
}
.home-page .journal-hero h1,
.home-page .journal-hero p {
  margin-left: auto;
  margin-right: auto;
}
.home-page .flex-between {
  justify-content: center;
}
.home-page .issues-grid {
  justify-items: center;
}
.home-page .issue-card {
  text-align: left;
  width: 100%;
  min-height: 260px;
}
.home-page .issue-card:hover {
  box-shadow: var(--shadow-lg);
}
.home-features-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 24px;
  margin-top: 32px;
  align-items: stretch;
}
.home-feature-card {
  text-align: center;
  padding: 24px;
  background: var(--seashell);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  min-height: 220px;
}

.issue-card {
  background: var(--seashell);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 24px;
  cursor: pointer;
  transition: all var(--transition);
  text-decoration: none;
  display: flex;
  flex-direction: column;
  height: 100%;
  width: 100%;
  min-height: 260px;
  color: var(--text);
}
.issue-card:hover { border-color: var(--accent); box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.issue-vol { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text2); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
.issue-title {
  font-family: var(--font-serif);
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: 10px;
  line-height: 1.35;
  min-height: 3.2em;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.issue-meta {
  font-size: 0.82rem;
  color: var(--text2);
  margin-top: auto;
  line-height: 1.5;
  min-height: 3em;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.issues-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 20px; align-items: stretch; }

.toc-list { list-style: none; }
.toc-item {
  padding: 18px 0;
  border-bottom: 1px solid var(--bg3);
  display: flex;
  gap: 20px;
  cursor: pointer;
  transition: background var(--transition);
  border-radius: 4px;
}
.toc-item:hover { background: var(--bg2); padding-left: 12px; }
.toc-pages {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--text3);
  min-width: 60px;
  padding-top: 3px;
}
.toc-item-title { font-family: var(--font-serif); font-size: 1rem; font-weight: 700; margin-bottom: 4px; color: var(--accent); }
.toc-item-authors { font-size: 0.82rem; color: var(--text2); }

.article-hero {
  padding: 32px;
  background: var(--seashell);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 24px;
}
.article-hero-title { font-family: var(--font-serif); font-size: 1.7rem; font-weight: 700; line-height: 1.3; margin-bottom: 16px; }
.article-meta-row { display: flex; flex-wrap: wrap; gap: 24px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--bg3); }
.article-meta-item { font-size: 0.85rem; }
.article-meta-item .meta-label { font-family: var(--font-mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3); margin-bottom: 3px; }
.article-abstract { line-height: 1.75; color: var(--text); font-size: 0.95rem; }
.article-section-head { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text3); margin-bottom: 8px; margin-top: 20px; }

/* ─── SUBMISSION FORM ─── */
.form-steps { display: flex; gap: 0; margin-bottom: 32px; }
.form-step {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  background: var(--bg2);
  border: 1px solid var(--border);
  font-size: 0.82rem;
  color: var(--text2);
  position: relative;
}
.form-step:first-child { border-radius: var(--radius) 0 0 var(--radius); }
.form-step:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
.form-step:not(:first-child) { margin-left: -1px; }
.form-step.active { background: var(--accent); color: #fff; border-color: var(--accent); z-index: 1; }
.form-step.done { background: var(--success-bg); color: var(--success); border-color: var(--success); }
.step-num { font-family: var(--font-mono); font-weight: 700; font-size: 0.9rem; }

/* ─── REVIEW FORM ─── */
.review-option { display: flex; flex-direction: column; gap: 6px; }
.review-radio { display: none; }
.review-label {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all var(--transition);
  font-size: 0.9rem;
}
.review-radio:checked + .review-label {
  border-color: var(--accent);
  background: var(--accent-bg);
  color: var(--accent);
  font-weight: 700;
}
.review-label .rv-icon { font-size: 1.2rem; }

/* ─── MODAL ─── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  animation: fadeIn 0.15s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--seashell);
  border-radius: var(--radius);
  max-width: 640px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  animation: slideUp 0.2s ease;
}
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-header {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}
.modal-title { font-family: var(--font-serif); font-size: 1.1rem; font-weight: 700; }
.modal-body { padding: 24px; }
.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
  justify-content: flex-end;
}
.btn-close {
  background: none; border: none; cursor: pointer; font-size: 1.4rem; color: var(--text3);
  line-height: 1; padding: 0; transition: color var(--transition);
}
.btn-close:hover { color: var(--danger); }

/* ─── ARTICLE DRAWER ─── */
.drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 900;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.drawer-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(680px, 90vw);
  background: var(--seashell);
  border-left: 1px solid var(--border);
  box-shadow: -4px 0 32px rgba(0,0,0,0.15);
  z-index: 901;
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.25s ease;
  overflow: hidden;
}
.drawer.open { transform: translateX(0); }
.drawer-header {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-shrink: 0;
  background: var(--bg);
}
.drawer-title { font-family: var(--font-serif); font-size: 1rem; font-weight: 700; }
.drawer-body { flex: 1; overflow-y: auto; padding: 24px; }
.drawer-footer {
  padding: 14px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  flex-shrink: 0;
  background: var(--bg);
}

/* ─── XML EXPORT ─── */
.xml-preview {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  background: #3c2b0e;
  color: #f8dab5;
  padding: 20px;
  border-radius: var(--radius);
  overflow-x: auto;
  white-space: pre;
  max-height: 400px;
  line-height: 1.6;
}
.xml-preview .xml-tag { color: #f1b22b; }
.xml-preview .xml-attr { color: #f8dab5; }
.xml-preview .xml-val { color: #fdf5ed; }

/* ─── NOTIFICATIONS ─── */
.toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; }
.toast {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 18px;
  background: var(--sidebar-bg); color: #fff;
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  font-size: 0.88rem;
  animation: slideInRight 0.25s ease;
  min-width: 280px;
}
@keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
.toast.warning { background: var(--gold); }

/* ─── ALERTS ─── */
.alert {
  display: flex;
  gap: 12px;
  padding: 14px 16px;
  border-radius: var(--radius);
  border: 1px solid;
  margin-bottom: 16px;
  font-size: 0.88rem;
  line-height: 1.5;
}
.alert-info { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
.alert-warn { background: var(--warning-bg); border-color: var(--gold); color: var(--warning); }
.alert-success { background: var(--success-bg); border-color: var(--success); color: var(--success); }
.alert-error { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }

/* ─── MISC ─── */
.divider { height: 1px; background: var(--border); margin: 24px 0; }
.text-mono { font-family: var(--font-mono); }
.text-sm { font-size: 0.82rem; }
.text-muted { color: var(--text2); }
.flex { display: flex; align-items: center; }
.flex-between { display: flex; align-items: center; justify-content: space-between; }
.gap-8 { gap: 8px; }
.gap-12 { gap: 12px; }
.gap-16 { gap: 16px; }
.mb-8 { margin-bottom: 8px; }
.mb-16 { margin-bottom: 16px; }
.mb-24 { margin-bottom: 24px; }
.mb-32 { margin-bottom: 32px; }
.mt-16 { margin-top: 16px; }
.mt-24 { margin-top: 24px; }
.w-full { width: 100%; }
.hidden { display: none !important; }
.italic { font-style: italic; }
.precheck-result {
  border-radius: var(--radius);
  border: 1px solid var(--border);
  overflow: hidden;
}
.precheck-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--bg3);
  font-size: 0.88rem;
}
.precheck-item:last-child { border-bottom: none; }
.timeline { list-style: none; }
.timeline-item {
  display: flex; gap: 16px;
  padding-bottom: 20px;
  position: relative;
}
.timeline-item::before {
  content: '';
  position: absolute;
  left: 15px; top: 28px;
  width: 2px; bottom: 0;
  background: var(--bg3);
}
.timeline-item:last-child::before { display: none; }
.timeline-dot {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.8rem;
  flex-shrink: 0;
  z-index: 1;
}
.timeline-dot.active { border-color: var(--accent); background: var(--accent); color: #fff; }
.timeline-dot.done { border-color: var(--success); background: var(--success); color: #fff; }
.timeline-content { flex: 1; padding-top: 4px; }
.timeline-date { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text3); }
.timeline-text { font-size: 0.88rem; margin-top: 3px; }

/* ─── AUTH / PUBLIC LAYOUT ─── */
#app.shell-public #sidebar { transform: translateX(0); }
#app.shell-public #main-wrap { margin-left: var(--sidebar-w); }
#app.shell-public #page-content { max-width: 1100px; padding: 36px 40px; }
#app.shell-public #topbar { padding: 0 32px; }

.login-shell {
  min-height: calc(100vh - var(--header-h) - 60px);
  display: grid;
  place-items: center;
}
.login-card {
  width: min(520px, 100%);
  background: var(--seashell);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}
.login-head {
  padding: 26px 28px 18px;
  background: linear-gradient(135deg, #644917 0%, #f1b22b 52%, #f8dab5 100%);
  color: #fff;
}
.login-head h1 {
  font-family: var(--font-serif);
  font-size: 1.5rem;
  margin-bottom: 8px;
}
.login-head p { font-size: 0.9rem; color: rgba(255,255,255,0.84); line-height: 1.6; }
.login-body { padding: 22px 28px 28px; }
.cred-table {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 4px;
  border-collapse: collapse;
  margin-top: 12px;
  overflow: hidden;
}
.cred-table th, .cred-table td {
  border-bottom: 1px solid var(--bg3);
  padding: 8px 10px;
  font-size: 0.8rem;
}
.cred-table tr:last-child td { border-bottom: 0; }
.cred-table th {
  font-family: var(--font-mono);
  font-size: 0.66rem;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  background: var(--bg2);
}

/* ─── ISSUE REDESIGN ─── */
.issue-layout { display: grid; grid-template-columns: 300px 1fr; gap: 24px; align-items: start; }
.issue-panel {
  background: var(--seashell);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.issue-cover {
  position: relative;
  aspect-ratio: 3 / 4;
  overflow: hidden;
  --cover-g1: #644917;
  --cover-g2: #f1b22b;
  --cover-g3: #f8dab5;
  --cover-text: #fff;
  background: linear-gradient(160deg, var(--cover-g1) 0%, var(--cover-g2) 55%, var(--cover-g3) 100%);
}
.issue-cover-image {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.issue-cover-fallback-inner {
  background: linear-gradient(160deg, var(--cover-g1) 0%, var(--cover-g2) 55%, var(--cover-g3) 100%);
  color: var(--cover-text);
  padding: 18px;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

// Parse CSV
function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = parseCSVLine(lines[0]);
  return lines.slice(1).map(line => {
    const vals = parseCSVLine(line);
    const obj = {};
    headers.forEach((h,i) => obj[h.trim()] = (vals[i]||'').trim());
    return obj;
  });
}

function parseCSVLine(line) {
  const result = [];
  let cur = '';
  let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { inQ = !inQ; continue; }
    if (c === ',' && !inQ) { result.push(cur); cur = ''; continue; }
    cur += c;
  }
  result.push(cur);
  return result;
}

function extractFilename(path='') {
  return String(path || '').trim().split('/').filter(Boolean).pop() || '';

function normalizePdfPath(path='', fallback='') {
  const value = String(path || '').trim();
  if (value && /\.pdf($|[?#])/i.test(value) && !value.endsWith('/')) return value;
  const fb = String(fallback || '').trim();
  if (fb && /\.pdf($|[?#])/i.test(fb) && !fb.endsWith('/')) return fb;
  return '';
}

function hydrateSeries1Data() {
  if (hasFullUserManifestOverride()) return;
  const s1 = window.__INGEST_SERIES1;
  if (!s1) return;

  // Reapply Series 1 deterministically from series1_manifest.js without touching Series 2/3.
  const series1Slugs = new Set(
    (Array.isArray(s1.issues) ? s1.issues : []).map(iss => String(iss?.slug || '')).filter(Boolean)
  );
  const removedIssueIds = new Set(
    DB.issues
      .filter(issue => issue?.series === 'seria-1' || series1Slugs.has(String(issue?.slug || '')))
      .map(issue => String(issue.id || ''))
      .filter(Boolean)
  );
  DB.issues = DB.issues.filter(issue =>
    issue?.series !== 'seria-1' && !series1Slugs.has(String(issue?.slug || ''))
  );
  DB.articles = DB.articles.filter(article => {
    const bySeries = article?.series === 'seria-1';
    const byIssueId = removedIssueIds.has(String(article?.issue_id || ''));
    return !bySeries && !byIssueId;
  });

  let nextIssueId = Math.max(0, ...DB.issues.map(i => Number(i.id) || 0)) + 1;
  let nextArticleId = Math.max(0, ...DB.articles.map(a => Number(a.id) || 0)) + 1;
  const slugToId = {};

  if (Array.isArray(s1.issues)) {
    for (const iss of s1.issues) {
      const id = String(nextIssueId++);
      slugToId[iss.slug] = id;
      const arts = (s1.articles || []).filter(a => a.issue_slug === iss.slug);
      const starts = arts.map(a => a.pages_start).filter(v => v != null);
      const ends = arts.map(a => a.pages_end).filter(v => v != null);
      const totalPages = (ends.length ? Math.max(...ends) : 0) - (starts.length ? Math.min(...starts) : 0);
      const sourceFromIssue = extractFilename(iss.source_pdf_name || iss.source_pdf);
      const sourceFromArticle = extractFilename((arts.find(a => a.source_pdf_name || a.source_pdf)?.source_pdf_name) || (arts.find(a => a.source_pdf_name || a.source_pdf)?.source_pdf));
      const mappedSource = SERIES1_SOURCE_PDF_BY_SLUG[String(iss.slug || '')] || SERIES1_SOURCE_PDF_BY_YEAR[String(iss.year || '')] || '';
      const sourcePdfName = sourceFromIssue || sourceFromArticle || mappedSource;
      const fallbackIssuePdfPath = sourcePdfName ? `ingest/series1/${sourcePdfName}` : '';
      const issuePdfPath = normalizePdfPath(iss.issue_pdf_path, fallbackIssuePdfPath);
      const volumeLabel = String(iss.volume || '').trim();
      let issueTitle = String(iss.title || '').trim();
      if (!issueTitle || issueTitle.toLowerCase() === 'undefined') {
        issueTitle = 'Anuarul Arhivei de Folklor';
      }
      if (volumeLabel && issueTitle.indexOf(volumeLabel) === -1) {
        issueTitle = `${issueTitle} ${volumeLabel}`.trim();
      }

      DB.issues.push({
        id: id,
        slug: iss.slug,
        year: iss.year,
        volume: iss.volume,
        number: iss.number,
        date_published: iss.year + '-12-31',
        title: issueTitle,
        status: 'published',
        article_count: arts.length,
        pages: totalPages > 0 ? totalPages : '',
        doi_prefix: '',
        series: 'seria-1',
        series_label: iss.series_label || 'Seria I (1932\u20131945)',
        issue_pdf_path: issuePdfPath,
        cover_hint_path: ''
      });
    }
  }

  if (Array.isArray(s1.articles)) {
    for (const art of s1.articles) {
      const issueId = slugToId[art.issue_slug];
      if (!issueId) continue;
      const id = String(nextArticleId++);
      DB.articles.push({
        id: id,
        issue_id: issueId,
        title: art.title || '',
        authors: art.author || '',
        affiliations: '',
        emails: '',
        abstract_ro: '',
        abstract_en: '',
        abstract_fr: art.abstract_fr || '',
        keywords_ro: art.keywords_ro || '',
        keywords_en: art.keywords_fr || '',
        pages_start: art.pages_start != null ? String(art.pages_start) : '',
        pages_end: art.pages_end != null ? String(art.pages_end) : '',
        doi: '',
        language: 'ro',
        status: 'published',
        section: art.section || '',
        series: 'seria-1',
        pdf_path: art.article_pdf_path || '',
        conf_title: '',
        conf_authors: '',
        conf_keywords_ro: '',
        conf_keywords_en: '',
        conf_abstract: ''
      });
    }
  }
}

function hydrateSeries2Data() {
  if (hasFullUserManifestOverride()) return;

  const manifestIssues = (s2 && Array.isArray(s2.issues)) ? s2.issues : [];
  const sourceIssues = [...manifestIssues];
  const sourceIssueSlugs = new Set(sourceIssues.map(i => String(i.slug || '')));
  for (const fallbackIssue of SERIES2_FALLBACK_ISSUES) {
    if (!sourceIssueSlugs.has(String(fallbackIssue.slug || ''))) sourceIssues.push(fallbackIssue);

  for (const iss of sourceIssues) {
    const slug = String(iss.slug || '');
    if (!slug || existingIssueSlugs.has(slug)) continue;

    const yearText = String(iss.year || '');
    const yearFirst = firstYearOfRange(yearText);

    const fallbackIssuePdf = 'ingest/series2/' + String(iss.pdf || iss.source_pdf_name || '').trim();

      slug,
      year: yearText,

      number: String(iss.number || iss.volume || ''),

    });
  }

  if (!sourceArticles.length) return;

  const slugToIssueId = {};
  DB.issues.forEach(issue => {
    if (issue.slug) slugToIssueId[String(issue.slug)] = String(issue.id);
  });
  const existingArticleKeys = new Set(
    DB.articles.map(article => String(article.issue_id || '') + '|' + String(article.title || '').trim().toLowerCase())
  );
  let nextArticleId = Math.max(0, ...DB.articles.map(a => Number(a.id) || 0)) + 1;

  for (const art of sourceArticles) {
    const issueId = slugToIssueId[String(art.issue_slug || '')];
    if (!issueId) continue;
    const title = String(art.title || '');
    const key = issueId + '|' + title.trim().toLowerCase();
    if (!title || existingArticleKeys.has(key)) continue;

    const idx = Number(art.toc_index || art.index) || 0;
    const fallbackPdf = idx > 0
      ? ('ingest/series2/issues/' + art.issue_slug + '/articles/' + String(idx).padStart(3, '0') + '-' + slugify(title) + '.pdf')
      : '';

    DB.articles.push({
      id: String(nextArticleId++),
      issue_id: issueId,
      title: title,
      authors: String(art.author || ''),
      affiliations: '',
      emails: '',
      abstract_ro: '',
      abstract_en: '',
      keywords_ro: '',
      keywords_en: '',
      pages_start: (art.pages_start ?? art.page_start) != null ? String(art.pages_start ?? art.page_start) : '',
      pages_end: (art.pages_end ?? art.page_end) != null ? String(art.pages_end ?? art.page_end) : '',
      doi: '',
      language: 'ro',
      status: 'published',
      section: String(art.section || ''),
      series: 'seria-2',
      pdf_path: String(art.article_pdf_path || fallbackPdf),
      conf_title: '',
      conf_authors: '',
      conf_keywords_ro: '',
      conf_keywords_en: '',
      conf_abstract: '',
    });
    existingArticleKeys.add(key);
  }
}

function hydrateMetrics() {
  const sanitizeEventsMap = (raw) => {
    const source = raw && typeof raw === 'object' ? raw : {};
    const out = {};
    Object.entries(source).forEach(([key, value]) => {
      const arr = Array.isArray(value) ? value : [];
      const cleaned = arr
        .map(item => Number(item))
        .filter(item => Number.isFinite(item) && item > 0);
      if (cleaned.length) out[String(key)] = cleaned;
    });
    return out;
  };
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEYS.metrics) || '{}');
    State.metrics = {
      articleViews: { ...(saved.articleViews || {}) },
      pdfDownloads: { ...(saved.pdfDownloads || saved.pdfViews || {}) },
      articleViewEvents: sanitizeEventsMap(saved.articleViewEvents),
      pdfDownloadEvents: sanitizeEventsMap(saved.pdfDownloadEvents || saved.pdfViewEvents),
    };
  } catch (_) {
    State.metrics = { articleViews: {}, pdfDownloads: {}, articleViewEvents: {}, pdfDownloadEvents: {} };

    default: return '/';
  }
}

function findAuthorBySlug(slug) {
  const names = [...new Set(DB.articles.flatMap(a => splitAuthors(a.authors)))];
  const matches = names.filter(name => slugify(name) === slug);
  if (!matches.length) return '';
  return matches.sort((a, b) => authorDisplayScore(b) - authorDisplayScore(a))[0];
}

function parseLocationRoute() {
  const fullUrl = new URL(window.location.href);
  const path = isFileMode()
    ? (window.location.hash || '#/').replace(/^#/, '')
    : fullUrl.pathname;
  const clean = path.replace(/\/+$/,'') || '/';

  if (clean === '/login') return { page: 'login', params: {} };
  if (clean === '/') return { page: 'public-home', params: {} };
  if (clean === '/issues') return { page: 'public-issues', params: {} };
  if (clean === '/about') return { page: 'public-about', params: {} };
  if (clean === '/editorial-team') return { page: 'public-editorial-team', params: {} };
  if (clean === '/advisory-board') return { page: 'public-advisory-board', params: {} };
  if (clean === '/submit') return { page: 'submit', params: {} };
  if (/^\/issue\/[^/]+$/.test(clean)) return { page: 'public-issue', params: { id: decodeURIComponent(clean.split('/')[2]) } };
  if (/^\/article\/[^/]+\.md$/.test(clean)) return { page: 'public-article-md', params: { id: decodeURIComponent(clean.split('/')[2].replace(/\.md$/,'')) } };
  if (/^\/article\/[^/]+$/.test(clean)) return { page: 'public-article', params: { id: decodeURIComponent(clean.split('/')[2]) } };
  if (/^\/author\/[^/]+$/.test(clean)) return { page: 'public-author', params: { name: findAuthorBySlug(clean.split('/')[2]) } };
  if (/^\/pdf-viewer\/[^/]+\/[^/]+$/.test(clean)) {
    const parts = clean.split('/');
    return { page: 'pdf-viewer', params: { type: decodeURIComponent(parts[2]), id: decodeURIComponent(parts[3]) } };
  }

  const exact = {
    '/editor/dashboard': 'dashboard',
    '/editor/issues': 'editor-issues',
    '/editor/ingest': 'ingest',
    '/editor/submissions': 'submissions',
    '/editor/reviewers': 'reviewers',
    '/editor/export': 'export',
    '/reviewer/dashboard': 'reviewer-dashboard',
    '/reviewer/reviews': 'my-reviews',
    '/reviewer/review-form': 'review-form',
    '/author/dashboard': 'author-dashboard',
    '/author/submissions': 'my-submissions',
    '/admin/settings': 'admin-settings',
    '/admin/users': 'admin-users',
    '/admin/emails': 'admin-emails',
    '/admin/backup': 'admin-backup',
    '/admin/ai': 'admin-ai',
  };
  if (exact[clean]) return { page: exact[clean], params: {} };

  if (/^\/editor\/submissions\/[^/]+$/.test(clean)) return { page: 'submission-detail', params: { id: decodeURIComponent(clean.split('/')[3]) } };
  if (/^\/admin\/article\/[^/]+$/.test(clean)) return { page: 'admin-article-edit', params: { id: decodeURIComponent(clean.split('/')[3]) } };

  return { page: hasSession() ? DEFAULT_PAGE_FOR_ROLE[State.role] : 'public-home', params: {} };
}

function pageAllowedForRole(page, role) {
  const allowed = PAGE_ACCESS[page];
  if (!allowed) return true;
  return allowed.includes(role);
}

function canAccessPage(page) {
  if (isPublicPage(page)) return true;
  if (!hasSession()) return false;
  return pageAllowedForRole(page, State.role);
}

function firstAllowedRoleForPage(page) {
  if (!hasSession()) return null;
  return (State.session.roles || []).find(role => pageAllowedForRole(page, role)) || null;
}

function syncUrl(page, params={}, replace=false) {
  const path = routePathFor(page, params);
  if (isFileMode()) {
    const hash = `#${path}`;
    if ((window.location.hash || '#/') !== hash) {
      if (replace) {
        const base = `${window.location.pathname}${window.location.search}`;
        history.replaceState({}, '', `${base}${hash}`);
      } else {
        window.location.hash = path;
      }
    }
    return;
  }
  history[replace ? 'replaceState' : 'pushState']({}, '', path);
}

function navigate(page, params={}, options={}) {
  const opts = { replace: false, skipHistory: false, skipScroll: false, ...options };
  let targetPage = page;
  let targetParams = params;
  const sameArticleRoute = State.currentPage === 'public-article'
    && targetPage === 'public-article'
    && String(State.pageParams?.id || '') === String(targetParams?.id || '');
  if (targetPage === 'login' && hasSession()) {
    targetPage = DEFAULT_PAGE_FOR_ROLE[State.role] || 'dashboard';
  }

  if (!isPublicPage(targetPage) && !hasSession()) {
    State.postLoginRedirect = routePathFor(targetPage, targetParams);
    targetPage = 'login';
    targetParams = {};
  }

  if (!canAccessPage(targetPage)) {
    const nextRole = firstAllowedRoleForPage(targetPage);
    if (nextRole) {
      State.role = nextRole;
      persistSession();
    } else {
      targetPage = DEFAULT_PAGE_FOR_ROLE[State.role] || 'public-home';
      targetParams = {};
    }
  }

  if (!sameArticleRoute) State.lastCountedArticleId = '';

  State.currentPage = targetPage;
  State.pageParams = targetParams;
  syncShellMode();
  renderSidebar();
  renderTopbar();
  renderPage();
  updateHeadMetadata();
  if (!opts.skipHistory) syncUrl(targetPage, targetParams, opts.replace);
  if (!opts.skipScroll) window.scrollTo(0,0);
}

function syncShellMode() {
  const app = document.getElementById('app');
  const isPublicShell = State.currentPage === 'login' || isPublicPage(State.currentPage);
  app.classList.toggle('shell-public', isPublicShell);

  const roleSwitcher = document.getElementById('role-switcher');
  if (roleSwitcher) roleSwitcher.style.display = hasSession() ? 'flex' : 'none';
}

function routeFromLocation(replace=true) {
  const { page, params } = parseLocationRoute();
  navigate(page, params, { replace, skipHistory: false, skipScroll: true });
}

function setRole(r) {
  if (!hasSession()) return;
  if (!(State.session.roles || []).includes(r)) return;
  State.role = r;
  persistSession();
  hideRoleModal();
  document.getElementById('role-label').textContent = roleLabel(r);
  const currentAllowed = canAccessPage(State.currentPage);
  navigate(currentAllowed ? State.currentPage : (DEFAULT_PAGE_FOR_ROLE[r] || 'public-home'));
}
function switchRoleAndClose(role) { setRole(role); hideRoleModal(); }
function showRoleModal() {
  if (!hasSession()) return;
  const optionsEl = document.getElementById('role-modal-options');
  const roles = State.session.roles || [];
  const roleIcons = {
    admin: 'solar:settings-bold-duotone',
    editor: 'solar:clipboard-text-bold-duotone',
    reviewer: 'solar:magnifer-bold-duotone',
    author: 'solar:pen-new-square-bold-duotone',
  };
  optionsEl.innerHTML = roles.map(role => `
    <button class="btn btn-secondary w-full" onclick="switchRoleAndClose('${role}')" style="justify-content:flex-start;">
      ${solarIcon(roleIcons[role] || 'solar:user-bold-duotone')} ${roleLabel(role)}
    </button>
  `).join('');
  document.getElementById('role-modal').classList.remove('hidden');
}
function hideRoleModal() { document.getElementById('role-modal').classList.add('hidden'); }

function loginUser() {
  const username = document.getElementById('login-username')?.value?.trim();
  const password = document.getElementById('login-password')?.value?.trim();
  const user = AUTH_USERS.find(u => u.username === username && u.password === password);
  if (!user) {
    toast('Credențiale invalide. Verificați username/parolă.', 'error');
    return;
  }
  State.session = { username: user.username, name: user.name, roles: user.roles };
  State.role = user.roles[0];
  persistSession();
  toast(`Autentificare reușită: ${user.name}`, 'success');

  const redirectPath = State.postLoginRedirect || routePathFor(DEFAULT_PAGE_FOR_ROLE[State.role] || 'dashboard');
  State.postLoginRedirect = '';
  if (!isFileMode()) {
    history.replaceState({}, '', redirectPath);
    routeFromLocation(true);
    return;
  }
  window.location.hash = redirectPath;
}

function logoutUser() {
  State.session = null;
  State.role = 'public';
  State.postLoginRedirect = '';
  persistSession();
  toast('Sesiune închisă.', 'success');
  navigate('public-home');
}

function renderSidebar() {
  const activeRole = hasSession() ? State.role : 'public';
  const nav = ROLE_NAV[activeRole] || [];
  let html = '';
  for (const item of nav) {
    if ('section' in item) {
      if (item.section) {
        html += `<div class="nav-section"><div class="nav-section-label">${ui(item.section)}</div></div>`;
      }
      continue;
    }
    if (!item.page || !item.label) continue;
    const active = State.currentPage === item.page ? 'active' : '';
    html += `<div class="nav-item ${active}" onclick="navigate('${item.page}')">
      <span class="nav-icon">${solarIcon(item.icon)}</span>
      <span>${ui(item.label)}</span>
      ${item.badge ? `<span class="nav-badge">${item.badge}</span>` : ''}
    </div>`;
  }
  document.getElementById('sidebar-nav').innerHTML = html;
  document.getElementById('role-label').textContent = hasSession()
    ? `${roleLabel(State.role)}`
    : roleLabel('public');
}

function confBar(score) {
  const cls = score >= 0.85 ? 'conf-hi' : score >= 0.7 ? 'conf-mid' : 'conf-lo';
  const pct = Math.round(score * 100);
  return `<span class="conf-bar" style="float:right;"><span class="conf-dot ${cls}"></span>${pct}%</span>`;
}

function toggleArticleCard(id) {
  const body = document.getElementById('aib-'+id);
  if (body) body.classList.toggle('open');
}

function parseIssueNumberToken(value='') {
  const matches = String(value || '').match(/\d+/g);
  if (!matches || !matches.length) return 0;
  return Number(matches[matches.length - 1]) || 0;
}

function sortIssuesReverseChronological(a, b) {
  const ay = yearSortValue(a?.year);
  const by = yearSortValue(b?.year);
  if (by !== ay) return by - ay;

  const av = parseIssueNumberToken(a?.volume);
  const bv = parseIssueNumberToken(b?.volume);
  if (bv !== av) return bv - av;

  const an = parseIssueNumberToken(a?.number);
  const bn = parseIssueNumberToken(b?.number);
  if (bn !== an) return bn - an;

  return (Number(b?.id) || 0) - (Number(a?.id) || 0);
}

function getIssueSeries(issue) {
  return issue?.series || 'seria-3';
}

function getSeriesLabel(series) {
  if (series === 'seria-1') return 'Seria I (1932\u20131945)';
  if (series === 'seria-2') return 'Seria a II-a (1980-1998)';
  return 'Seria a III-a (2022\u2013prezent)';
}

function getDashboardIssuesOrdered() {
  const sorted = [...DB.issues].sort(sortIssuesReverseChronological);
  const seria3 = sorted.filter(issue => getIssueSeries(issue) === 'seria-3');
  const seria2 = sorted.filter(issue => getIssueSeries(issue) === 'seria-2');
  const seria1 = sorted.filter(issue => getIssueSeries(issue) === 'seria-1');
  const other = sorted.filter(issue => !['seria-3', 'seria-2', 'seria-1'].includes(getIssueSeries(issue)));
  return [...seria3, ...seria2, ...seria1, ...other];
}

function getIssueDisplayVolume(issue) {
  const rawVolume = String(issue?.volume || '').trim();
  const series = getIssueSeries(issue);
  if (series !== 'seria-1') return rawVolume || '—';
  const title = String(issue?.title || '');
  const romanTokens = title.match(/\b[IVXLCDM]+(?:[-–][IVXLCDM]+)?\b/g);
  if (romanTokens && romanTokens.length) return romanTokens[romanTokens.length - 1];
  return rawVolume || '—';
}

function getIssueTotalPages(issue) {
  const direct = Number(issue?.pages);
  if (Number.isFinite(direct) && direct > 0) return String(Math.round(direct));
  const articles = DB.getArticlesByIssue(issue?.id || '');
  if (!articles.length) return '—';
  let minStart = Infinity;
  let maxEnd = -Infinity;
  articles.forEach(article => {
    const start = Number(article.pages_start);
    const end = Number(article.pages_end);
    if (Number.isFinite(start) && start > 0) minStart = Math.min(minStart, start);
    if (Number.isFinite(end) && end > 0) maxEnd = Math.max(maxEnd, end);
  });
  if (!Number.isFinite(minStart) || !Number.isFinite(maxEnd) || maxEnd < minStart) return '—';
  return String(maxEnd - minStart + 1);
}

function getSeriesCardClass(issue) {
  return 'series-' + getIssueSeries(issue);
}

function normalizeSectionKey(section='') {
  return String(section || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z]+/g, '');
}

function sectionDisplay(section='') {
  const key = normalizeSectionKey(section);
  if (key.includes('recenzii') || key.includes('bookreview')) {
    return { key: 'recenzii', label: tr('Recenzii', 'Reviews') };
  }
  if (key.includes('studii') || key.includes('cercetari') || key.includes('researchandstudies')) {
    return { key: 'studii-si-articole', label: tr('Studii și articole', 'Studies and articles') };
  }
  if (key.includes('arhivadefolclor') || key.includes('folklorearchive')) {
    return { key: 'arhiva-de-folclor', label: tr('Arhiva de folclor', 'Folklore archive') };
  }
  if (key.includes('restituiri')) {
    return { key: 'restituiri', label: tr('Restituiri', 'Restitutions') };
  }
  if (key.includes('notedelectura') || key.includes('notes')) {
    return { key: 'note-de-lectura', label: tr('Note de lectură', 'Reading notes') };
  }
  const clean = String(section || '').replace(/\s+/g, ' ').trim();
  return { key: key || 'fara-sectiune', label: clean || tr('Fără secțiune', 'No section') };
}

function pagePublicAuthor() {

  const matchedAuthorNames = [...new Set(
    DB.articles.flatMap(art => splitAuthors(art.authors).filter(author => authorNamesEquivalent(author, name)))
  )];
  const articles = DB.articles.filter(art => splitAuthors(art.authors).some(author => authorNamesEquivalent(author, name)));

  const orcid = resolveAuthorMapValue(AUTHOR_ORCID, name) || '';

function pagePdfViewer() {
  const type = State.pageParams?.type === 'issue' ? 'issue' : 'article';
  const id = String(State.pageParams?.id || '');
  if (!id) return `<div class="page-title">${tr('PDF negăsit', 'PDF not found')}</div>`;

  const article = type === 'article' ? DB.getArticle(id) : null;
  const issue = type === 'issue'
    ? DB.getIssue(id)
    : article ? DB.getIssue(article.issue_id) : null;
  const issueTitle = String(issue?.title || 'Anuarul Arhivei de Folklor');

  if (!issue) return `<div class="page-title">${tr('PDF negăsit', 'PDF not found')}</div>`;
  const pdfAsset = resolvePdfAsset(type, id);

  const title = type === 'issue'
    ? `${tr('PDF număr', 'Issue PDF')} — Vol. ${issue.volume} Nr. ${issue.number}`
    : `${tr('PDF articol', 'Article PDF')} — ${article?.title || ''}`;
  const subtitle = type === 'issue'
    ? `${issueTitle} · ${issue.year}`
    : `${tr('Pagini', 'Pages')}: ${article?.pages_start || '—'}-${article?.pages_end || '—'}`;

  return `
<div class="pdf-viewer-shell">
  <div class="flex-between">
    <div>
      <div class="page-title">${title}</div>
      <div class="page-subtitle">${subtitle}</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <button class="btn btn-secondary" onclick="navigate('${type === 'issue' ? 'public-issue' : 'public-article'}',{id:'${type === 'issue' ? issue.id : article?.id || ''}'})">← ${tr('Înapoi', 'Back')}</button>
      <button class="btn btn-primary" onclick="downloadPdfFromViewer('${type}','${id}')">⬇ ${tr('Descarcă PDF', 'Download PDF')}</button>
    </div>
  </div>

  <div class="pdf-frame ${pdfAsset?.url ? '' : 'pdf-frame-missing'}">
    ${pdfAsset?.url ? `<iframe class="pdf-embed" src="${pdfAsset.url}#toolbar=1&navpanes=0&view=FitH" title="${escapeHtml(title)}"></iframe>` : `<div class="pdf-frame-inner">
      <div style="font-family:var(--font-serif);font-size:1.45rem;font-weight:700;margin-bottom:10px;">${tr('Vizualizator PDF', 'PDF viewer')}</div>
      <div class="text-sm text-muted">${tr('Fișierul PDF nu este configurat pentru acest document.', 'The PDF file is not configured for this document.')}</div>
